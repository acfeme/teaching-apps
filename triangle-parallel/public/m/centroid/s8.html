<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/engine/gate.js" data-mat="centroid-lesson"></script>
<title>무게중심 모둠 스피드 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="c.css">
<style>
main{display:flex;align-items:flex-start;justify-content:center;padding:clamp(8px,1.2vw,18px);overflow-y:auto}
.box{width:min(1400px,100%);display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.4vw,20px)}
.panel{width:100%;background:#fff;border:4px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--ink);padding:clamp(12px,1.8vw,26px);font-family:var(--display);font-size:clamp(20px,2.4vw,38px)}
.panel h2{margin:0 0 8px;font-size:1.25em}
.rules{font-family:var(--display);font-size:.85em;color:#5a5070;line-height:1.5}
.pick{display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(6px,.8vw,12px);margin:8px 0 14px}
.pick button{font:inherit;font-size:1.1em;border:4px solid var(--ink);border-radius:18px;background:#fff;padding:8px 0;cursor:pointer;box-shadow:4px 4px 0 var(--ink);position:relative}
.pick button.on{background:var(--sun);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.pick button small{position:absolute;left:0;right:0;bottom:-2px;font-size:.38em;color:#9a8fb0}
.go{font:inherit;font-size:1.3em;border:4px solid var(--ink);border-radius:22px;background:var(--coral);color:#fff;padding:10px 40px;cursor:pointer;box-shadow:6px 6px 0 var(--ink)}
.go:disabled{background:#ccc}
.ghost{font:inherit;font-size:.95em;border:3px solid var(--ink);border-radius:999px;background:#fff;padding:6px 22px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-family:var(--display);font-size:clamp(20px,2.4vw,38px)}
.bar span{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 18px}
.bar .time{background:var(--ink);color:#fff;min-width:5.5em;text-align:center}
.q{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(12px,1.6vw,26px);align-items:center;position:relative}
.q svg{width:100%;height:auto;max-height:52vh;background:#FFFDF5;border:3px solid #eee0c5;border-radius:18px}
.q svg text{font-family:var(--display)}
.kind{display:inline-block;font-size:.75em;background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:0 14px;transform:rotate(-2deg);margin-bottom:6px}
.qt{font-size:clamp(26px,3.2vw,52px);line-height:1.35;word-break:keep-all}
.cho{display:flex;gap:10px;margin:6px 0}
.cho b{display:inline-flex;align-items:center;justify-content:center;width:clamp(56px,6.5vw,104px);height:clamp(56px,6.5vw,104px);font-size:clamp(34px,4.6vw,74px);background:var(--note);border:4px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);animation:pop .4s both}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,1vw,16px);margin-top:12px}
.opt{font:inherit;font-size:clamp(26px,3.2vw,52px);border:4px solid var(--ink);border-radius:20px;background:#fff;padding:clamp(8px,1vw,16px);cursor:pointer;box-shadow:5px 5px 0 var(--ink);color:var(--ink)}
.opt:nth-child(1){background:#FFE3E3}.opt:nth-child(2){background:#DDF0FF}.opt:nth-child(3){background:#E2F8EC}.opt:nth-child(4){background:#F0E6FF}
.opt.no{background:#bbb !important;color:#fff;opacity:.55;animation:shake .35s}
.opt.yes{background:#2DBE9E !important;color:#fff}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:min(36vw,300px);opacity:0;font-family:var(--display);color:var(--coral)}
.flash.on{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:.95;transform:scale(.6)}100%{opacity:0;transform:scale(1.3)}}
.count{font-family:var(--display);font-size:min(40vw,320px);color:var(--coral);animation:pop .5s both}
table{width:100%;border-collapse:collapse;font-size:.9em}
th,td{padding:6px 8px;text-align:center;border-bottom:3px dashed #eee0c5}
tr.me td{background:#FFF6C8}
tr.first td{font-size:1.1em}
.empty{color:#9a8fb0;text-align:center;padding:10px}
@media (max-width:760px){.q{grid-template-columns:1fr}.pick{grid-template-columns:repeat(4,1fr)}.opts{grid-template-columns:1fr 1fr}}
</style>
<!-- 8. 모둠 스피드 퀴즈: 모둠이 A~H형 중 하나를 골라 8문제를 푼다(유형끼리 문제 종류·난이도는 같고 겹치는 문제는 없음).
     틀리면 5초 추가, 걸린 시간이 짧을수록 1등. 기록은 서버에 20분 동안 남아 모든 모둠 화면에서 보인다. -->
<div id="app">
  <header>
    <div class="tag">⑧ 모둠 스피드 퀴즈</div><span class="by">by 이송원</span>
    <div id="hint">모둠끼리 기록 대결! 빨리, 정확하게 ⚡</div>
    <div class="btns"><button class="pill" id="board" type="button">🏆 기록판</button><button class="pill" id="home" type="button">🏠 처음으로</button></div>
  </header>
  <main><div class="box" id="box"></div></main>
</div>
<div class="flash" id="flash"></div>
<script src="c.js"></script>
<script src="cq.js"></script>
<script>
const { $, sfx, confetti } = C;
const { shuffle, TYPES, setOf, fig } = CQ;
// 같은 문제에서 틀릴수록 벌점이 커진다: 첫 번째 +20초, 두 번째 +30초, 세 번째 +40초 (마구 찍는 모둠은 평균 5분 넘게 → 상위권 어려움)
const PEN = [20, 30, 40];
const penOf = (r) => (Number.isFinite(r.pen) ? r.pen : (Number(r.wrong) || 0) * 5); // 예전 기록(pen 없음)은 5초씩
// ---------- 기록판(서버, 20분) ----------
// 따로 배포한 주소에서도 기록은 본 사이트 서버에 저장
const API = /triangle-parallel|localhost|127.0.0.1/.test(location.hostname) ? '' : 'https://triangle-parallel.vercel.app';
const myCls = (() => { try { const m = JSON.parse(sessionStorage.getItem('tp-me') || 'null'); return (m && m.cls) || sessionStorage.getItem('mat-cls') || ''; } catch (e) { return ''; } })();
async function getRecords() { try { const r = await fetch(API + '/api/game?game=cquiz', { cache: 'no-store' }); return (await r.json()).records || []; } catch (e) { return null; } }
async function postRecord(rec) { const r = await fetch(API + '/api/game', { method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: 'cquiz', ...rec, cls: myCls }) }); return (await r.json()).records || []; }
const fmt = (sec) => `${Math.floor(sec / 60)}:${(sec % 60).toFixed(1).padStart(4, '0')}`;
const okOf = (r) => (Number.isFinite(r.ok) ? r.ok : Math.max(0, 8 - r.wrong)); // 예전 기록(ok 없음)은 어림값
function boardHtml(list, me) {
  if (!list) return '<div class="empty">기록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</div>';
  if (!list.length) return '<div class="empty">아직 기록이 없어요. 첫 기록의 주인공이 되어 봐요!</div>';
  const ago = (t) => { const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? '방금' : `${m}분 전`; };
  // 순위: ① 한 번에 맞힌 문제(ok)가 많을수록 위 ② 같으면 최종 기록(시간 기록 + 틀림 × 5초)이 짧을수록 위 — 마구 찍어 빨리 끝내는 모둠이 1등 못 하게
  return `<table><tr><th>순위</th><th>모둠</th><th>유형</th><th>한 번에 맞힘</th><th>시간 기록</th><th>틀림 벌점</th><th>최종 기록</th><th></th></tr>${list.map((r, i) => {
    const raw = Math.max(0, Math.round((r.sec - penOf(r)) * 10) / 10);
    return `<tr class="${i === 0 ? 'first' : ''} ${me && me.at === r.at ? 'me' : ''}"><td>${i === 0 ? '🏆' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</td><td>${r.cls ? `${r.cls}반 ` : ''}${r.group}모둠</td><td>${r.type}형</td><td><b style="color:#13906F;font-size:1.15em">${okOf(r)}</b> / 8</td><td>${fmt(raw)}</td><td>${r.wrong}개 <span style="color:#FF6B6B">(+${penOf(r)}초)</span></td><td><b style="color:#2A2140;font-size:1.15em">${fmt(r.sec)}</b></td><td style="font-size:.7em;color:#9a8fb0">${ago(r.at)}</td></tr>`;
  }).join('')}</table><div style="font-size:.7em;color:#9a8fb0;margin-top:6px">최종 기록 = 시간 기록 + 틀림 벌점 · 최종 기록이 짧을수록 1등 · 벌점은 같은 문제에서 틀릴수록 커져요 (+20 → +30 → +40초)</div>`;
}
let boardTimer = null;
async function showBoard(me) {
  clearInterval(timer); clearInterval(boardTimer);
  const paint = async () => {
    const list = await getRecords();
    $('#box').innerHTML = `<div class="panel"><h2>🏆 모둠 기록판 <span style="font-size:.6em;color:#9a8fb0">(최근 20분 · 최종 기록이 짧을수록 1등)</span></h2>${boardHtml(list, me)}
      <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="ghost" id="b1" type="button">🏠 처음으로</button></div></div>`;
    $('#b1').onclick = home;
  };
  await paint();
  boardTimer = setInterval(paint, 5000);
}
// ---------- 진행 ----------
let group = 0, type = '', list = [], qi = 0, t0 = 0, wrong = 0, ok = 0, missed = false, qWrong = 0, pen = 0, timer = null, busy = false;
async function home() {
  clearInterval(timer); clearInterval(boardTimer);
  const recs = (await getRecords()) || [];
  const used = new Set(recs.map((r) => r.type));
  $('#hint').textContent = '모둠끼리 기록 대결! 빨리, 정확하게 ⚡';
  $('#box').innerHTML = `<div class="panel"><h2>⚡ 무게중심 모둠 스피드 퀴즈</h2>
    <div class="rules">📌 8문제를 모두 맞히면 끝! · ⏱ 최종 기록이 짧을수록 1등! · ❌ 틀리면 벌점 — 같은 문제에서 <b style="color:#FF6B6B">첫 번째 +${PEN[0]}초, 두 번째 +${PEN[1]}초, 세 번째 +${PEN[2]}초</b> · 🏆 기록은 20분 동안 기록판에 남아요.<br>🙅 마구 찍으면 벌점이 쌓여서 오히려 늦어져요. 한 번쯤 실수해도 괜찮아요, 모둠이 의논해서 맞혀요!<br>A~H형은 문제 종류와 난이도가 같고, 문제는 모두 달라요.</div>
    <div style="margin-top:10px">① 우리 모둠</div><div class="pick" id="g">${[1, 2, 3, 4, 5, 6, 7, 8].map((n) => `<button data-g="${n}" type="button">${n}</button>`).join('')}</div>
    <div>② 문제 유형</div><div class="pick" id="t">${TYPES.map((t) => `<button data-t="${t}" type="button">${t}${used.has(t) ? '<small>다른 모둠도 풀었어요</small>' : ''}</button>`).join('')}</div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="go" id="start" type="button" disabled>시작! ▶</button><span id="sel" style="color:#9a8fb0"></span></div></div>`;
  const upd = () => { $('#start').disabled = !(group && type); $('#sel').textContent = group && type ? `${group}모둠 · ${type}형` : '모둠과 유형을 골라요'; };
  document.querySelectorAll('[data-g]').forEach((b) => { b.onclick = () => { group = +b.dataset.g; document.querySelectorAll('[data-g]').forEach((x) => x.classList.toggle('on', x === b)); sfx.pop(); upd(); }; });
  document.querySelectorAll('[data-t]').forEach((b) => { b.onclick = () => { type = b.dataset.t; document.querySelectorAll('[data-t]').forEach((x) => x.classList.toggle('on', x === b)); sfx.pop(); upd(); }; });
  if (group) document.querySelector(`[data-g="${group}"]`)?.classList.add('on');
  if (type) document.querySelector(`[data-t="${type}"]`)?.classList.add('on');
  upd();
  $('#start').onclick = countdown;
}
function countdown() {
  let n = 3;
  const show = () => { $('#box').innerHTML = `<div class="count">${n || 'GO!'}</div>`; sfx.pop(); };
  show();
  const iv = setInterval(() => { n -= 1; if (n >= 0) show(); else { clearInterval(iv); begin(); } }, 750);
}
function begin() {
  list = setOf(TYPES.indexOf(type)); qi = 0; wrong = 0; ok = 0; missed = false; qWrong = 0; pen = 0; busy = false; t0 = performance.now();
  clearInterval(timer);
  timer = setInterval(() => { const el = $('#time'); if (el) el.textContent = `⏱ ${fmt(elapsed())}`; }, 100);
  show();
}
const elapsed = () => (performance.now() - t0) / 1000 + pen;
function show() {
  const p = list[qi];
  $('#hint').textContent = `${group}모둠 · ${type}형 — 다 함께 의논해서 골라요!`;
  $('#box').innerHTML = `<div class="bar"><span class="time" id="time">⏱ ${fmt(elapsed())}</span><span>${qi + 1} / ${list.length}</span><span>❌ ${wrong} (+${pen}초)</span></div>
    <div class="panel q"><div id="fig"></div><div><span class="kind">${p.k}</span>
      ${p.cho ? `<div class="cho">${[...p.cho].map((c, i) => `<b style="animation-delay:${i * 0.08}s">${c}</b>`).join('')}</div>` : ''}
      <div class="qt">${p.t}</div>
      <div class="opts">${p.o.map((o) => `<button class="opt" data-v="${o}" type="button">${o}</button>`).join('')}</div></div></div>`;
  $('#fig').appendChild(fig(p.f, TYPES.indexOf(type)));
  document.querySelectorAll('.opt').forEach((b) => { b.onclick = () => pick(b); });
}
function flash(t, col) { const f = $('#flash'); f.textContent = t; f.style.color = col || ''; f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
function pick(b) {
  if (busy || b.classList.contains('no')) return;
  const p = list[qi];
  if (b.dataset.v === p.a) {
    busy = true; if (!missed) ok += 1; b.classList.add('yes'); sfx.good(); flash('⭕', '#2DBE9E');
    setTimeout(() => { busy = false; missed = false; qWrong = 0; qi += 1; if (qi < list.length) show(); else finish(); }, 550);
  } else {
    const add = PEN[Math.min(qWrong, PEN.length - 1)]; qWrong += 1; pen += add;
    wrong += 1; missed = true; b.classList.add('no'); sfx.bad(); flash(`+${add}초`, '#FF6B6B');
    const bar = document.querySelector('.bar span:last-child'); if (bar) bar.textContent = `❌ ${wrong} (+${pen}초)`;
  }
}
async function finish() {
  clearInterval(timer);
  const sec = Math.round(elapsed() * 10) / 10;
  sfx.win();
  $('#hint').textContent = '클리어! 기록을 저장하고 있어요…';
  $('#box').innerHTML = `<div class="panel" style="text-align:center"><div style="font-size:2.4em">🎉 ${fmt(sec)}</div><div>${group}모둠 · ${type}형 · 틀린 횟수 ${wrong}</div></div>`;
  let recs = null, me = null;
  try { recs = await postRecord({ group, type, sec, wrong, ok, pen }); me = recs.find((r) => r.group === group && r.type === type && okOf(r) === ok && Math.abs(r.sec - sec) < 0.05) || null; } catch (e) { recs = null; }
  const rank = recs && me ? recs.indexOf(me) + 1 : 0;
  $('#hint').textContent = rank === 1 ? '🏆 지금 1등이에요! 상품 후보!' : rank ? `지금 ${rank}등이에요!` : '기록을 저장하지 못했어요 (기록판에 남지 않을 수 있어요)';
  $('#box').innerHTML = `<div class="panel" style="text-align:center"><div style="font-size:2.2em">${rank === 1 ? '🏆' : '🎉'} 최종 기록 ${fmt(sec)}</div><div>${group}모둠 · ${type}형 · 🎯 한 번에 맞힘 <b style="color:#13906F">${ok} / 8</b></div><div style="color:#5a5070">시간 기록 ${fmt(Math.max(0, Math.round((sec - pen) * 10) / 10))} + 틀림 ${wrong}개 벌점 ${pen}초 = <b style="color:#2A2140">${fmt(sec)}</b></div></div>
    <div class="panel"><h2>🏆 기록판 <span style="font-size:.6em;color:#9a8fb0">(최근 20분)</span></h2>${boardHtml(recs, me)}
    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="ghost" id="again" type="button">다른 유형 도전</button><button class="ghost" id="live" type="button">기록판 크게 보기</button></div></div>`;
  $('#again').onclick = () => { type = ''; home(); };
  $('#live').onclick = () => showBoard(me);
}
$('#home').onclick = home;
$('#board').onclick = () => showBoard(null);
home();
</script>
