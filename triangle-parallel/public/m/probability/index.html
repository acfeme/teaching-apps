<!doctype html>
<html lang="ko">
<head>
<script>window.VC_MODE = 1;</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모둠 수학 8단원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 칠판(초록) + 학습지(흰 종이) — 교실 그대로 */
:root{
  --bg:#eef2ee; --paper:#ffffff; --ink:#1b2420; --muted:#5a6a61; --line:#d6dfd8;
  --board:#24553f; --board2:#1b4532; --board-ink:#f2f7f1; --chalk:#f0c24f;
  --ok:#23804e; --ok-bg:#e1f2e7; --bad:#be4a33; --bad-bg:#fbe8e2; --wait:#8a6a12; --wait-bg:#fbf0d2;
  --focus:#2a6fdb; --card-shadow:0 1px 2px rgba(20,40,30,.08),0 4px 14px rgba(20,40,30,.06);
  --f-display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --paper:#1b231f; --ink:#e7eee9; --muted:#9db0a5; --line:#2e3b34;
  --board:#1d4733; --board2:#163a29; --board-ink:#eef5ef; --chalk:#f0c24f;
  --ok:#5cc58a; --ok-bg:#183a27; --bad:#f08a72; --bad-bg:#3d1f18; --wait:#e8c65e; --wait-bg:#3a3014;
  --focus:#7aa7ff; --card-shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --paper:#1b231f; --ink:#e7eee9; --muted:#9db0a5; --line:#2e3b34;
  --board:#1d4733; --board2:#163a29; --board-ink:#eef5ef; --chalk:#f0c24f;
  --ok:#5cc58a; --ok-bg:#183a27; --bad:#f08a72; --bad-bg:#3d1f18; --wait:#e8c65e; --wait-bg:#3a3014;
  --focus:#7aa7ff; --card-shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wide{max-width:1280px}
.board{background:var(--board);color:var(--board-ink);border-bottom:6px solid #7a5a36}
.board .wrap{padding-block:14px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
.board h1{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0;letter-spacing:.01em}
.board h1 small{color:var(--chalk);font-size:.95rem;margin-left:8px}
.who{font-size:.95rem;opacity:.95}
.who b{color:var(--chalk);font-weight:700}
.bar{height:8px;background:var(--board2);border-radius:99px;overflow:hidden;flex-basis:100%}
.bar i{display:block;height:100%;background:var(--chalk);transition:width .4s}
.demo{background:var(--wait-bg);color:var(--wait);font-size:.9rem;padding:10px 14px;border-radius:10px;margin-bottom:14px}
.demo a{color:inherit;font-weight:700}
.jumprow{margin-top:10px;gap:8px}
.jumprow label{font-size:.9rem}
.jumprow select{flex:1 1 220px;min-width:0;padding:8px 10px;font-size:.95rem;border-color:var(--chalk)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--card-shadow);display:grid;gap:14px}
.stack{display:grid;gap:16px}
.eyebrow{font-size:.82rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.eyebrow .tag{display:inline-block;background:var(--board);color:var(--board-ink);border-radius:6px;padding:1px 8px;margin-right:6px;font-weight:500}
.q{font-size:1.12rem;margin:0}
.q small{display:block;color:var(--muted);font-size:.88rem;margin-top:4px}
h2{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0;text-wrap:balance}
h3{font-size:1.02rem;margin:0}
.muted{color:var(--muted)}
label{font-weight:700;font-size:.95rem}
.field{display:grid;gap:6px}
input[type=text],input[type=number],select,textarea{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--paper);font-size:1.05rem}
input:focus,select:focus,textarea:focus{border-color:var(--board);outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > input{flex:1 1 160px;min-width:0}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 20px;font-weight:700;background:var(--board);color:var(--board-ink);cursor:pointer;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.chalk{background:var(--chalk);color:#2b2205}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn.danger{background:var(--bad);color:#fff}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--board)}
.fb{border-radius:10px;padding:12px 14px;font-weight:500}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.wait{background:var(--wait-bg);color:var(--wait)}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:var(--bg);border-radius:10px;padding:10px 12px}
.steps li::before{content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--board);color:var(--board-ink);display:grid;place-items:center;font-size:.85rem;font-weight:700}
.piece{border:2px dashed var(--chalk);background:var(--wait-bg);border-radius:12px;padding:14px 16px}
.piece + .piece{margin-top:8px}
.piece .lab{font-size:.78rem;font-weight:700;color:var(--wait);letter-spacing:.05em}
.collab{border-left:5px solid var(--chalk);padding-left:14px;display:grid;gap:10px}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mem{border:2px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px;background:var(--paper)}
.mem.on{border-color:var(--ok);background:var(--ok-bg)}
.mem .nm{font-weight:700}
.mem .st{font-size:.85rem;color:var(--muted)}
.mem.on .st{color:var(--ok)}
.digit{font-family:var(--f-display);font-size:4.2rem;line-height:1;color:var(--board);background:var(--wait-bg);border:3px solid var(--chalk);border-radius:16px;width:110px;height:110px;display:grid;place-items:center;margin:0 auto}
.codein{font-size:1.8rem !important;letter-spacing:.5em;text-align:center;font-family:var(--f-display)}
.order{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.order li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:8px;background:var(--bg)}
.chk{display:flex;gap:8px;flex-wrap:wrap}
.chk label{display:flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:500;cursor:pointer}
.tree{font-family:ui-monospace,Consolas,monospace;font-size:.95rem;background:var(--bg);border-radius:10px;padding:12px 14px;white-space:pre-wrap}
.done-hero{text-align:center;display:grid;gap:10px;padding:30px 20px}
.big-ok{font-family:var(--f-display);font-size:2.4rem;color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.scroll{overflow-x:auto}
/* 교사 화면 */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.gcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--card-shadow);display:flex;flex-direction:column}
.ghead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:8px}
.ghead h3{font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.gstat{font-family:var(--f-display);font-size:1.6rem;padding:2px 14px;border-radius:10px}
.gstat.ok{background:var(--ok);color:#fff}
.gstat.no{background:var(--bad-bg);color:var(--bad)}
.gsub{font-size:.85rem;color:var(--muted);padding:0 16px 8px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 16px;border-top:1px solid var(--line);align-items:center}
.mrow .nm{font-weight:700}
.mrow .pg{font-size:.85rem;color:var(--muted);grid-column:1}
.pill{font-size:.8rem;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.no{background:var(--bad-bg);color:var(--bad)}
.pill.wait{background:var(--wait-bg);color:var(--wait)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;grid-column:1 / -1}
.lockscreen{position:fixed;inset:0;z-index:100;background:rgba(20,10,10,.62);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-left,0px))}
.lockbox{background:var(--paper);color:var(--ink);border-radius:16px;padding:28px 24px;max-width:460px;width:100%;text-align:center;display:grid;gap:12px;border:4px solid var(--mark);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.lockbox h2{color:var(--mark)}
.lockbox p{margin:0}
.warn-mark{width:64px;height:64px;border-radius:50%;background:var(--mark);color:#fff;font-family:var(--f-display);font-size:2.6rem;display:grid;place-items:center;margin:0 auto;animation:warnpulse 1s ease-in-out infinite alternate}
@keyframes warnpulse{from{transform:scale(1)}to{transform:scale(1.08)}}
.warn-who{font-size:1.15rem;font-weight:700;color:var(--mark-ink)}
.warnbox .btn{justify-self:center}
.leavebadge{display:inline-block;margin:6px auto 0;padding:10px 22px;border-radius:14px;font-size:1.35rem;font-weight:700;border:3px solid}
.leavebadge.ok{color:var(--ok,#1b7f4b);border-color:currentColor;background:#eefaf2}
.leavebadge.bad{color:#c0392b;border-color:currentColor;background:#fdeeee}
.leavenote{font-size:.8rem;opacity:.85}
.warnstrip{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--mark);color:#fff;font-weight:700;text-align:center;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
.talert{border:3px solid var(--mark);background:var(--mark-bg);margin-bottom:14px}
.talert h3{color:var(--mark-ink)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.watchchk{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:.88rem}
.ttab td,.ttab th{white-space:nowrap}
.lkrow{background:var(--mark-bg)}
/* 해결해요: 아기자기한 풀이 */
.buddy{display:flex;gap:12px;align-items:flex-start}
.buddy svg{flex:0 0 auto;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bd-face{fill:#ffd66b;stroke:#c9962a;stroke-width:2}
.bd-eye{fill:#3a2a12}.bd-shine{fill:#fff}
.bd-cheek{fill:#ff9b9b;opacity:.7}
.bd-smile{fill:none;stroke:#3a2a12;stroke-width:2.4;stroke-linecap:round}
.bd-top{stroke:#c9962a;stroke-width:2.4;stroke-linecap:round}.bd-ball{fill:#ff8a8a}
.bubble{position:relative;background:var(--paper);border:2px solid var(--chalk);border-radius:16px;padding:10px 14px;font-weight:500;line-height:1.5;flex:1 1 auto;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;top:16px;border:8px solid transparent;border-right-color:var(--chalk);border-left:0}
.pvis-pic .vis{background:linear-gradient(180deg,var(--wait-bg),var(--bg))}
.pstep{border-radius:16px}
.pstep.done{border-style:dashed}
.pstep .sn{display:inline-flex;align-items:center;gap:6px}
.cheer{display:inline-flex;gap:2px;margin-right:6px;color:var(--chalk)}
.cheer i{font-style:normal;animation:twinkle .7s ease-out both}
.cheer i:nth-child(2){animation-delay:.1s}.cheer i:nth-child(3){animation-delay:.2s}
@keyframes twinkle{from{transform:scale(0) rotate(-40deg);opacity:0}60%{transform:scale(1.5)}to{transform:none;opacity:1}}
.g2 .dcell{display:inline-grid;place-items:center;cursor:default;font-weight:500}
.g2 th{font-weight:700;font-size:.85rem}
.g2c{font-size:.75rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i.dcell{width:20px;height:16px;display:inline-block;border-radius:4px}
.areasvg{width:100%;height:auto}
.ar-cell{fill:var(--paper);stroke:var(--line);stroke-width:1}
.ar-ta{fill:var(--mark);opacity:.75}
.ar-tb{fill:var(--g1);stroke:var(--mark);stroke-width:2;stroke-dasharray:5 3;opacity:.9}
.ar-lab{fill:var(--ink);font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
.ar-sub{fill:var(--muted);font-size:11px;text-anchor:middle}
.lg-ta,.lg-tb{width:20px;height:14px;display:inline-block;border-radius:3px}
.lg-ta{background:var(--mark);opacity:.75}.lg-tb{background:var(--g1);border:2px dashed var(--mark)}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:80px 1fr 48px;gap:8px;align-items:center}
.bt{height:22px;background:var(--bg);border-radius:99px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--g0f);border-radius:99px;opacity:.55}
.barrow.hl .bt i{background:var(--mark);opacity:.85}
.barrow.hl .bn,.barrow.hl .bv{color:var(--mark-ink);font-weight:700}
.half{stroke:var(--mark);stroke-dasharray:5 4;stroke-width:2}
.freq{fill:none;stroke:var(--g0f);stroke-width:2.5}
.talk{display:grid;gap:8px}
.say{border-radius:14px;padding:8px 12px;border:2px solid var(--line)}
.say.ok{border-color:var(--ok);background:var(--ok-bg)}
.say.no{border-color:var(--mark);background:var(--mark-bg)}
.okx tr.yes td,.okx tr.yes th,.mv tr.yes td{background:var(--mark-bg);color:var(--mark-ink);font-weight:700}
.cal td.wed{background:var(--mark);color:#fff;font-weight:700}
.cal td.sat{background:var(--g1);color:var(--mark-ink);outline:2px dashed var(--mark);outline-offset:-3px;font-weight:700}
.cal th.hlc{color:var(--mark)}
.plist{display:grid;gap:10px}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.plab{font-weight:700;border-radius:99px;padding:3px 12px;font-size:.9rem}
.plab.ta{background:var(--mark);color:#fff}
.plab.tb{background:var(--g1);color:var(--mark-ink);border:2px dashed var(--mark)}
.pair{font-variant-numeric:tabular-nums;font-weight:700;border-radius:10px;padding:4px 10px;font-size:1.02rem}
.pair.ta{background:var(--mark-bg);color:var(--mark-ink);border:2px solid var(--mark)}
.pair.tb{background:var(--g1);color:var(--mark-ink);border:2px dashed var(--mark)}
.pcount{font-weight:700;color:var(--board)}
.hubsec{grid-column:1 / -1;margin:8px 0 0;font-size:1.05rem}
.hubcard.prac{border-left:5px solid var(--chalk)}
.tablab{align-self:center;font-size:.85rem;min-width:70px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{min-width:44px;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:.85rem;cursor:pointer;color:var(--ink)}
.pchip.cur{border-color:var(--board);box-shadow:0 0 0 3px var(--focus)}
.pchip.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pchip.sol{background:var(--wait-bg);border-color:var(--wait);color:var(--wait)}
.pchip:disabled,.pchip.lockd{opacity:.45;cursor:not-allowed}
.pchip.now{border-color:var(--board);border-width:3px}
.stepnav{padding:12px 16px;display:grid;gap:8px;margin-bottom:12px}
.stepnav-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stepnav-lab{font-size:.82rem;font-weight:700;min-width:84px;color:var(--muted,#666)}
.fracin{display:inline-grid;grid-template-rows:auto 3px auto;gap:4px;justify-items:center;vertical-align:middle}
.fracin input{width:84px;text-align:center;font-size:1.15rem;padding:6px}
.fracin .fbar{width:96px;height:3px;background:var(--ink);border-radius:2px}
.ansrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pstep{border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:var(--paper)}
.pstep.done{border-color:var(--ok);background:var(--ok-bg)}
.pstep .sn{font-weight:700;color:var(--board)}
.pstep .after{color:var(--ok);font-weight:700}
.ptab{border-collapse:collapse;width:auto}
.ptab th,.ptab td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.ptab caption{font-weight:700;margin-bottom:4px}
.cal td,.cal th{min-width:38px}
.dk{fill:var(--paper);stroke:var(--board);stroke-width:3}
.dkl{stroke:var(--board);stroke-width:1.5}
.dkt{fill:var(--ink);font-size:16px;font-weight:700;text-anchor:middle}
.nl{stroke:var(--ink);stroke-width:2}
.np{fill:var(--mark)}
.pbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px}
.pbar i{display:block;height:100%;background:var(--ok)}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:16px}
.hubcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;box-shadow:var(--card-shadow);align-content:start}
.hubcard.off{opacity:.6}
.hubcard h3{font-family:var(--f-display);font-weight:400;font-size:1.35rem}
.hubno{font-family:var(--f-display);font-size:2rem;color:var(--board);line-height:1}
.hdrbtn{background:transparent;color:var(--board-ink);border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:2px 10px;font-size:.85rem;cursor:pointer}
.chtabs .tool{font-size:1rem}
.openpanel{margin-bottom:16px}
.opentab{width:auto}
.opentab th,.opentab td{text-align:center;padding:4px 6px}
.clstabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.mrow.away{opacity:.55}
.joinrow > .field{flex:1 1 140px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.82rem;margin-left:auto;padding:4px}
.gfoot{margin-top:auto;padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.summary{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.summary b{font-family:var(--f-display);font-size:2rem;font-weight:400}
/* 그림 풀이 */
:root{--g0:#dce8ff;--g0f:#1d4c99;--g1:#ffe2c7;--g1f:#94440a;--g2:#e6dbff;--g2f:#553599;--ball1:#5ea3ff;--ball2:#2459b3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g0:#1f3357;--g0f:#bcd3ff;--g1:#4a2c12;--g1f:#ffcf9f;--g2:#352a55;--g2f:#d6c8ff}}
:root[data-theme="dark"]{--g0:#1f3357;--g0f:#bcd3ff;--g1:#4a2c12;--g1f:#ffcf9f;--g2:#352a55;--g2f:#d6c8ff}
.vis{display:grid;gap:12px;background:var(--bg);border-radius:12px;padding:14px;min-width:0}
.vis.live{border:2px solid var(--chalk)}
.vis.solved{pointer-events:none}
.vis.solved .vis-title,.vis.solved .row{display:none}
.vis-badge{justify-self:start;background:var(--chalk);color:#2b2205;font-size:.78rem;font-weight:700;border-radius:6px;padding:2px 10px}
.vis-title{font-weight:700;color:var(--ink)}
.vis h4{margin:0 0 6px;font-size:.95rem;display:flex;justify-content:space-between;gap:8px}
.toks{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tok{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px;display:grid;place-items:center;min-width:56px;min-height:56px}
button.tok{cursor:pointer}
button.tok:hover{border-color:var(--board)}
.tok.sel{border-color:var(--chalk);background:var(--wait-bg);transform:translateY(-2px)}
.tok.right{border-color:var(--ok);background:var(--ok-bg)}
.tok.wrong{border-color:var(--bad);background:var(--bad-bg)}
.die-b{fill:var(--paper);stroke:var(--ink);stroke-width:5}
.die-p{fill:var(--ink)}
.ball{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.1rem;color:#fff;background:radial-gradient(circle at 35% 30%,var(--ball1),var(--ball2))}
.timechip{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;padding:4px 8px}
.card-tok{width:44px;height:60px;border-radius:8px;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-size:1.6rem}
.person{width:44px;height:44px;border-radius:50%;background:var(--board);color:var(--board-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.3rem}
.bundle{display:inline-flex;gap:4px;padding:4px;border:3px solid var(--chalk);border-radius:99px;background:var(--wait-bg)}
.mg{display:flex;gap:12px;flex-wrap:wrap}
.mg > *{flex:1 1 200px;min-width:0}
.mg-box{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);display:grid;gap:6px;align-content:start}
.mg-box.skip{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-size:.92rem;font-weight:500;background:var(--g0);color:var(--g0f)}
.chip.g1{background:var(--g1);color:var(--g1f)}
.chip.g2{background:var(--g2);color:var(--g2f)}
.chip .n{background:var(--ink);color:var(--paper);border-radius:99px;font-size:.75rem;padding:0 7px;font-weight:700}
.pop{animation:pop .35s both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.eq{font-family:var(--f-display);font-size:1.45rem;color:var(--board);font-weight:400}
.fb.ok .eq{color:var(--ok)}
.gtab{width:auto;border-collapse:separate;border-spacing:4px}
.gtab th,.gtab td{border:0;padding:0;text-align:center}
.gcell{min-width:96px;min-height:42px;border:2px dashed var(--line);border-radius:8px;background:var(--paper);cursor:pointer;font-size:.88rem;padding:4px 8px}
.gcell.fill{border:2px solid var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.roads{width:100%;max-width:600px;height:auto}
.road{fill:none;stroke:var(--line);stroke-width:7;stroke-linecap:round;transition:stroke .2s}
.road.sel{stroke:var(--chalk)}
.road.on{stroke:var(--ok)}
.hit{fill:none;stroke:transparent;stroke-width:24;cursor:pointer}
.rn{fill:var(--board)}
.rl{fill:var(--muted);font-size:15px;font-weight:700;text-anchor:middle}
.rp{fill:var(--ink);font-size:16px;font-weight:700;text-anchor:middle}
.keypic{width:100%;max-width:360px;height:auto}
.k-body{fill:var(--chalk);stroke:var(--ink);stroke-width:3}
.k-hole{fill:var(--bg);stroke:var(--ink);stroke-width:3}
.k-lab{fill:var(--ink);font-size:20px;font-weight:700;text-anchor:middle}
.tree-ul{list-style:none;margin:0;padding-left:26px;border-left:2px solid var(--line)}
.tree-ul.tree-root{padding-left:0;border-left:0;display:grid;gap:4px}
.tree-ul li{position:relative;margin:5px 0}
.tree-ul .tree-ul li::before{content:"";position:absolute;left:-26px;top:17px;width:22px;border-top:2px solid var(--line)}
.node{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 12px;font-weight:700;cursor:pointer}
.node.open{border-color:var(--board)}
.node small,.leaf small{font-weight:400;color:var(--muted)}
.leaf{display:inline-flex;gap:6px;align-items:center;border-radius:8px;padding:3px 12px;background:var(--ok-bg);color:var(--ok);animation:pop .3s both}
.htree{width:100%;height:auto;display:block}
.ht-h{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle}
.ht-hr{fill:var(--mark)}
.ht-n{fill:var(--g0f);font-size:24px;font-family:var(--f-display);text-anchor:middle}
.ht-n2{fill:var(--g1f)}
.ht-l{stroke:var(--g0f);stroke-width:2.5;stroke-linecap:round}
.ht-a{stroke:var(--mark);stroke-width:3.5;stroke-linecap:round}
.ht-ah{fill:var(--mark)}
.ht-r{fill:var(--mark);font-size:24px;font-family:var(--f-display)}
.ht-in{animation:htfade .45s both}
@keyframes htfade{from{opacity:0}to{opacity:1}}
.sheet-h{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:22px 0 10px}
.sheet-h .muted{font-family:var(--f-body);font-size:.9rem}
.sheet-card + .sheet-card{margin-top:12px}
.tree2{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-start}
.tree2 > div{flex:0 1 auto;min-width:0}
.also{justify-self:start;font-family:var(--f-display);font-size:1.15rem;color:var(--mark);border:2px solid var(--mark);border-radius:8px;padding:2px 12px;background:var(--mark-bg)}
.memo{border-left:5px solid var(--mark);background:var(--mark-bg);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:1.1rem;font-weight:700;line-height:1.7}
.memo-lab{display:block;font-size:.78rem;font-weight:700;color:var(--mark-ink);letter-spacing:.04em}
.bigbtn{font-size:1.25rem;padding:16px 34px;border-radius:14px}
.note-tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:var(--card-shadow)}
.tool{border:2px solid var(--line);border-radius:8px;background:var(--paper);padding:6px 12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tool.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--focus)}
.swatch{width:16px;height:16px;border-radius:50%;display:inline-block}
.nq-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.note-card .q{font-size:1rem}
.pad{border:2px solid #cfd8d2;border-radius:10px;overflow:hidden;background-color:#fff;background-image:linear-gradient(#e7ede9 1px,transparent 1px),linear-gradient(90deg,#e7ede9 1px,transparent 1px);background-size:24px 24px}
.pad canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.eqin{flex:1 1 200px;min-width:0}
.pt{display:grid;gap:14px}
.pt-row{display:grid;grid-template-columns:auto 1fr;gap:0 18px;align-items:center}
.pt-root{font-weight:700;font-size:1rem}
.pt-kids{display:grid;gap:6px;border-left:3px solid var(--g0f);padding-left:18px;min-width:0}
.pt-kid{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pt-kid::before{content:"";position:absolute;left:-18px;top:50%;width:14px;border-top:3px solid var(--g0f)}
.pt-arrow{color:var(--muted)}
.pt-res{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.pt-res .n{background:var(--ink);color:var(--paper);border-radius:99px;font-size:.75rem;padding:0 7px;margin-right:2px}
.pair-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dgrid{width:auto;border-collapse:separate;border-spacing:3px}
.dgrid th,.dgrid td{border:0;padding:0;text-align:center}
.dcell{width:46px;height:36px;border:2px solid var(--line);border-radius:6px;background:var(--paper);cursor:pointer;font-size:.8rem;font-variant-numeric:tabular-nums}
.dcell.ta,.brush.ta{background:var(--g0);color:var(--g0f);border-color:var(--g0f)}
.dcell.tb,.brush.tb{background:var(--g1);color:var(--g1f);border-color:var(--g1f)}
.dcell.miss{outline:3px solid var(--bad)}
.brush{border:2px solid transparent}
.brush.on,[data-b].on{box-shadow:0 0 0 3px var(--focus)}
/* 그림 풀이에서 '고른 것' 표시는 붉은색으로 확실하게 */
:root{--mark:#d62020;--mark-bg:#ffe0e0;--mark-ink:#a10f0f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--mark:#ff5a5a;--mark-bg:#4d1a1a;--mark-ink:#ffc2c2}}
:root[data-theme="dark"]{--mark:#ff5a5a;--mark-bg:#4d1a1a;--mark-ink:#ffc2c2}
.vis .tok.sel,.vis .tok.right{border:4px solid var(--mark);background:var(--mark-bg);box-shadow:0 0 0 3px var(--mark-bg)}
.vis .tok.right .timechip{color:var(--mark-ink)}
.vis .road.on,.vis .road.sel{stroke:var(--mark);stroke-width:9}
.vis .gcell.fill{border:3px solid var(--mark);background:var(--mark-bg);color:var(--mark-ink)}
.vis .leaf{background:var(--mark-bg);color:var(--mark-ink);border:2px solid var(--mark)}
.vis .bundle{border-color:var(--mark);background:var(--mark-bg)}
.vis .dcell.ta{background:var(--mark);color:#fff;border-color:var(--mark);font-weight:700}
.vis .dcell.tb{background:var(--mark-bg);color:var(--mark-ink);border:3px dashed var(--mark);font-weight:700}
.vis [data-line] .chip,.vis [data-list] .chip{outline:2px solid var(--mark);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>

<body>
<header class="board"><div class="wrap" id="hdr"><h1>모둠 수학 <small>8단원 경우의 수와 확률</small></h1></div></header>
<main class="wrap" id="app"><p class="muted">불러오는 중…</p></main>
<script>
// ===== 공통 데이터 로직 (서버 Code.gs 와 데모 모드가 똑같이 사용) =====
var TEACHER_PIN = null; // 학생 화면에는 비밀번호 없음

// 학생 id = '반-번호' (예: '2반-15'), 모둠 key = '반-모둠' (예: '2반-3')
function core_(db, op, a, now) {
  db.s = db.s || {};
  db.g = db.g || {};
  a = a || {};
  var T = { ts: {}, tg: {}, ds: {}, dg: {} };
  function cmp(x, y) {
    var p = String(x).split('-'), q = String(y).split('-');
    if (p.length > 1 && q.length > 1 && p[0] !== q[0]) return p[0] < q[0] ? -1 : 1;
    var nx = Number(p[p.length - 1]), ny = Number(q[q.length - 1]);
    return (nx - ny) || (x < y ? -1 : x > y ? 1 : 0);
  }
  function lab(g) { var p = String(g).split('-'); return p.length > 1 ? p[0] + ' ' + p[1] + '모둠' : g + '모둠'; }
  function joined(g) {
    var r = [];
    for (var id in db.s) if (String(db.s[id].g) === String(g)) r.push(id);
    return r.sort(cmp);
  }
  function membersOf(g) {
    var grp = db.g[g];
    if (grp && grp.started) return grp.members.filter(function (id) { return !!db.s[id]; });
    return joined(g);
  }
  // TEACHER_PIN 이 null = 학생 기기 안에서만 도는 데모·미리보기 (비밀번호 검사 없음)
  function teacher() { if (TEACHER_PIN !== null && String(a.pin) !== String(TEACHER_PIN)) throw new Error('PIN'); }
  function setPath(o, path, v) {
    var ks = String(path).split('.');
    for (var i = 0; i < ks.length - 1; i++) {
      if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {};
      o = o[ks[i]];
    }
    o[ks[ks.length - 1]] = v;
  }
  function grpOf(g) {
    if (!db.g[g]) { db.g[g] = { g: String(g), started: false, members: [] }; T.tg[g] = 1; }
    return db.g[g];
  }
  function startIfReady(g) {
    var grp = grpOf(g);
    if (grp.started) return;
    var j = joined(g);
    if (j.length >= 2 && j.length <= 4 && j.every(function (id) { return db.s[id].ready; })) start(g, j);
  }
  function start(g, ids) {
    var grp = grpOf(g);
    grp.started = true; grp.members = ids; grp.t = now; T.tg[g] = 1;
    ids.forEach(function (id) { if (db.s[id].st === 'wait') { db.s[id].st = 'tb'; T.ts[id] = 1; } });
  }

  switch (op) {
    case 'join': {
      var cls = String(a.cls || '').trim(), no = Number(a.no), name = String(a.name || '').trim(), gn = String(a.gn || '');
      if (!cls) return { res: { ok: false, msg: '반을 고르세요.' }, T: T };
      if (!(no >= 1)) return { res: { ok: false, msg: '번호를 고르세요.' }, T: T };
      if (!name) return { res: { ok: false, msg: '이름을 입력하세요.' }, T: T };
      if (!gn) return { res: { ok: false, msg: '모둠을 고르세요.' }, T: T };
      var id = cls + '-' + no, g = cls + '-' + gn;
      var s = db.s[id];
      if (s && s.name !== name) return { res: { ok: false, msg: cls + ' ' + no + '번은 다른 이름으로 이미 들어와 있어요. 반과 번호를 다시 확인하세요.' }, T: T };
      if (s && String(s.g) !== g) {
        var old = db.g[s.g];
        if (old && old.started && old.members.indexOf(id) >= 0)
          return { res: { ok: false, msg: '이미 ' + lab(s.g) + '에서 활동 중이에요. ' + lab(s.g) + '으로 들어오세요.' }, T: T };
      }
      var grp = grpOf(g);
      if (!s) {
        s = db.s[id] = { id: id, cls: cls, no: no, name: name, g: g, gn: gn, ready: false, st: 'wait', tb: 0, ws: 0, ph: 'q',
          lg: {}, dg: {}, cl: {}, paper: false, t0: now, bot: !!a.bot };
      } else {
        s.g = g; s.gn = gn;
      }
      s.away = false;   // 빼기(결석 처리)했던 학생이 다시 들어오면 자동으로 복귀
      if (grp.started && grp.members.indexOf(id) < 0) {
        // 모둠이 이미 시작한 뒤에 들어온 학생: 모둠이 아직 1단계(교과서)면 정식 모둠원, 이미 2단계면 혼자 진행
        var ahead = grp.members.some(function (m) { return db.s[m] && (db.s[m].st === 'ws' || db.s[m].st === 'done'); });
        s.late = ahead;
        grp.members.push(id); grp.members.sort(cmp); T.tg[g] = 1;
        if (s.st === 'wait') s.st = 'tb';
      }
      if (a.bot) s.ready = true;
      T.ts[id] = 1;
      if (a.bot) startIfReady(g);
      return { res: { ok: true, me: s }, T: T };
    }
    case 'ready': {
      var s2 = db.s[a.id];
      if (!s2) return { res: { ok: false }, T: T };
      s2.ready = !!a.v; T.ts[a.id] = 1;
      startIfReady(s2.g);
      return { res: { ok: true }, T: T };
    }
    case 'group': {
      var gg = String(a.g), mine = db.s[a.id], al = [];
      // 같은 반에서 다른 창으로 이동해 잠긴 학생 (학생 화면에는 누구인지 보내지 않음: 시각과 '나인지'만)
      if (mine && mine.cls) for (var ia in db.s) { var x = db.s[ia]; if (x.lk && x.cls === mine.cls) al.push({ t: x.lkt, me: x.id === mine.id }); }
      return { res: { ok: true, group: db.g[gg] || null, members: membersOf(gg).map(function (i) { return db.s[i]; }),
        me: mine || null, alerts: al, now: now }, T: T };
    }
    case 'pdone': {
      // 해결해요 완료 기록 (문제별 기록은 모으지 않고 '다 풀었다'만)
      var pid = String(a.cls || '').trim() + '-' + Number(a.no);
      if (!a.cls || !(Number(a.no) >= 1)) return { res: { ok: false }, T: T };
      var ps = db.s[pid] || { id: pid, cls: String(a.cls), no: Number(a.no), lg: {}, st: 'wait', g: '', gn: '' };
      ps.name = String(a.name || ps.name || ''); ps.pc = Number(a.pc) || 0; ps.pp = ps.pc; ps.done = ps.done || now; ps.lv = Number(a.lv) || 0;
      db.s[pid] = ps; T.ts[pid] = 1;
      return { res: { ok: true }, T: T };
    }
    case 'me': {
      // 해결해요(개인 학습): 내 기록만
      return { res: { ok: true, me: db.s[a.id] || null, now: now }, T: T };
    }
    case 'upd': {
      var s3 = db.s[a.id];
      if (!s3) return { res: { ok: false, gone: true }, T: T };
      var p = a.patch || {};
      for (var k in p) setPath(s3, k, p[k]);
      T.ts[a.id] = 1;
      return { res: { ok: true }, T: T };
    }
    case 't_all': teacher(); return { res: { ok: true, s: db.s, g: db.g, now: now }, T: T };
    case 't_paper': {
      teacher();
      if (db.s[a.id]) { db.s[a.id].paper = !!a.v; T.ts[a.id] = 1; }
      return { res: { ok: true }, T: T };
    }
    case 't_start': {
      teacher();
      var js = joined(String(a.g));
      if (js.length >= 1 && !(db.g[a.g] && db.g[a.g].started)) start(String(a.g), js);
      return { res: { ok: true }, T: T };
    }
    case 't_unlock': {
      // 이탈로 잠긴 학생 해제
      teacher();
      if (db.s[a.id]) { db.s[a.id].lk = false; T.ts[a.id] = 1; }
      return { res: { ok: true }, T: T };
    }
    case 't_away': {
      // 모둠에서 빼기(결석 처리): 기록은 그대로 두고 숫자 모으기·의견에서만 빠짐
      teacher();
      if (db.s[a.id]) { db.s[a.id].away = !!a.v; T.ts[a.id] = 1; }
      return { res: { ok: true }, T: T };
    }
    case 't_resetGroup': {
      teacher();
      joined(String(a.g)).forEach(function (i) { delete db.s[i]; T.ds[i] = 1; });
      delete db.g[a.g]; T.dg[a.g] = 1;
      return { res: { ok: true }, T: T };
    }
    case 't_resetClass': {
      teacher();
      var c = String(a.cls);
      for (var i2 in db.s) if (db.s[i2].cls === c) { delete db.s[i2]; T.ds[i2] = 1; }
      for (var g2 in db.g) if (g2.indexOf(c + '-') === 0) { delete db.g[g2]; T.dg[g2] = 1; }
      return { res: { ok: true }, T: T };
    }
    case 't_resetAll': {
      teacher();
      for (var i1 in db.s) T.ds[i1] = 1;
      for (var g1 in db.g) T.dg[g1] = 1;
      db.s = {}; db.g = {};
      return { res: { ok: true }, T: T };
    }
  }
  throw new Error('unknown op ' + op);
}


// ===================== 문제 데이터 =====================
// 1단계: 교과서 (238~241쪽, 해결해요 제외) — 개인이 쉽게 답 맞히기
var TB = [
  {k:'t1', page:'238쪽 확인해요', q:'주사위 한 개를 던질 때, <b>짝수의 눈이 나온다</b>는 사건의 경우의 수는?', a:3, hint:'짝수의 눈을 모두 적어 보세요. 2, 4, …', exp:'짝수의 눈: 2, 4, 6 → <b>3</b>가지'},

    });
    if (conflict) return withLk({ok: true, open: open, prog: {}, conflict: true}, id);

    if (!(rec && rec.bot)) { var pk = pwCheckL(a); if (!pk.ok || pk.setNew) return {ok: false, pwbad: true, msg: pk.msg || '반·번호·이름 또는 비밀번호가 맞지 않아요.'}; }
  }
  if (op === 'lock') {
    var reg = lkLoad(), lid = a.cls + '-' + Number(a.no);

    if (TEACHER_PIN !== null && String(a.pin) !== String(TEACHER_PIN)) throw new Error('PIN');

    return {ok: true, open: res};

  if (op === 't_all') { var rg = lkLoad(); out.res.locks = rg.L; out.res.lkc = rg.C; }
  return out.res;
}

// ===================== 학생 화면 =====================
var me = null;        // 내 기록 (내 화면이 기준)
var G = null;         // 모둠 정보 {group, members}

var lastKey = '';
var wq = Promise.resolve();
// 저장: 서버가 바쁘거나 인터넷이 잠깐 끊겨도 저장될 때까지 다시 보냄 (예전에는 한 번 실패하면 그대로 사라졌음)
var PENDING = 0, SAVE_FAIL = false;
function sendUpd(id, patch, tries){ return sendOp('upd', {id:id, patch:patch}, tries); }
function sendOp(op, args, tries){
  return call(op, args).then(function(r){
    if (r && r.ok === false && !r.gone && !r.pwbad) throw new Error('not saved');
    SAVE_FAIL = false; return r;
  }).catch(function(){
    SAVE_FAIL = tries >= 2; saveWarn();
    return new Promise(function(res){ setTimeout(res, Math.min(2000 * (tries + 1), 10000)); }).then(function(){ return sendOp(op, args, tries + 1); });
  });
}
function saveWarn(){
  var el = document.getElementById('savewarn');
  if (!el) { el = document.createElement('div'); el.id = 'savewarn'; el.className = 'warnstrip'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.hidden = !(SAVE_FAIL && PENDING > 0);

}
window.addEventListener('beforeunload', function(e){ if (PENDING > 0) { e.preventDefault(); e.returnValue = ''; } });
var pollTimer = null;

// ---------- 해결해요: 기록은 학생 기기에만. 다 풀었을 때 '완료' 한 번만 서버로 ----------
var HUBPROG = {};   // 단원 목록에서 받은 서버 기록 (예전 진행 위치 이어받기용)
function pKey(ch){ return 'mm8-pme:' + PROFILE.cls + '-' + Number(PROFILE.no) + ':' + ch; }
function pLoad(ch){ try { return JSON.parse(lsGet(pKey(ch)) || 'null'); } catch(e){ return null; } }
function pStore(){ if (me && isPractice(CH) && !PREVIEW) lsSet(pKey(CH), JSON.stringify(me)); }
function pEnter(ch){
  var id = PROFILE.cls + '-' + Number(PROFILE.no), m = pLoad(ch);
  if (!m || m.name !== PROFILE.name) {
    m = {id: id, cls: PROFILE.cls, no: Number(PROFILE.no), name: PROFILE.name, pp: 0, pc: 0, lg: {}};
    var pr = HUBPROG[ch], items = PRACTICE[ch].items;
    if (pr && pr.pp) { for (var i = 0; i < Math.min(pr.pp, items.length); i++) m.lg[items[i].k] = {d: 1, f: 0, s: 1}; m.pp = Math.min(pr.pp, items.length); m.pc = m.pp; }
    if (pr && pr.pc >= items.length) m.sent = 1;
  }
  return m;
}
function pSave(patch){
  var N = PRACTICE[CH].items.length;
  if (!PREVIEW) { var lvn = leaveCount(); if (lvn !== (me.lv || 0)) me.lv = lvn; }
  Object.keys(patch).forEach(function(k){ setPath(me, k, patch[k]); });
  pStore();
  if ((me.pc || 0) >= N && !me.sent && !PREVIEW) {
    me.sent = 'sending'; pStore();
    var ch = CH;
    PENDING++;
    wq = wq.then(function(){ return VC ? vcSend({op: 'rec', ch: ch, cls: PROFILE.cls, no: Number(PROFILE.no), name: PROFILE.name, st: 'done', lv: me.lv || 0}) : sendOp('pdone', {ch: ch, cls: PROFILE.cls, no: PROFILE.no, name: PROFILE.name, pc: N, lv: me.lv || 0}, 0); })
      .then(function(){ PENDING--; if (me && CH === ch) { me.sent = 1; pStore(); } else { var m = pLoad(ch); if (m) { m.sent = 1; lsSet(pKey(ch), JSON.stringify(m)); } } saveWarn(); }, function(){ PENDING--; saveWarn(); });
  }
  return wq;
}
function save(patch){
  if (me && isPractice(CH)) return pSave(patch);
  if (me && VC && !PREVIEW) { var nst = Object.assign({}, me, patch).st; vcReport(CH, nst === 'done' ? 'done' : nst === 'ws' ? 's1' : 'start'); }
  if (me && !PREVIEW) { var lvn = leaveCount(); if (lvn !== (me.lv || 0)) patch.lv = lvn; }   // 이탈 횟수는 따로 보내지 않고 저장할 때 같이 보냄
  Object.keys(patch).forEach(function(k){ setPath(me, k, patch[k]); });
  var id = me.id;
  PENDING++;
  wq = wq.then(function(){ return sendUpd(id, patch, 0); }).then(function(){ PENDING--; saveWarn(); }, function(){ PENDING--; saveWarn(); });
  return wq;
}
var SOLO = true;   // 개별 풀기: 모둠 대기·나눠 갖기·의견 모으기 없이 각자 바로 풀기 (false = 모둠 활동)

  if (SOLO) return me ? [me] : [];

}

    if (n === '' && d === '') return null;

    var nn = num(n), dd = d === '' ? 1 : num(d);

function checkAns(type, v, a){

  // 틀렸을 때: 한 단계씩 중간 답을 쓰며 따라가기
  function guided(si, wrongs){
    showVis(si === 0 ? '괜찮아요! ' + (it.vis ? '그림을 보면서 ' : '') + '한 단계씩 같이 풀어 봐요.' : si < it.steps.length ? '좋아요, ' + si + '단계 통과! 다음 단계도 할 수 있어요.' : '거의 다 왔어요! 처음 문제의 답을 써 볼까요?');
    var html = '<h3>한 단계씩 풀어 봐요</h3>';
    for (var i = 0; i < si; i++) { var d = it.steps[i]; html += '<div class="pstep done"><span class="sn">' + (i + 1) + '단계 ✓</span><span>' + d.t + stepAnsText(d) + '</span>' + (d.after ? '<span class="muted">' + d.after + '</span>' : '') + '</div>'; }
    if (si < it.steps.length) {
      var st = it.steps[si];
      html += '<div class="pstep"><span class="sn">' + (si + 1) + '단계</span><span>' + st.t + '</span>' +
        (st.type === 'none' ? '<div><button class="btn small" id="sgo" type="button">알겠어요, 다음 단계</button></div>'
          : '<form class="ansrow" id="f">' + ansHTML(st.type, st.opts, 'sa') + '<button class="btn small" type="submit">확인</button></form><div id="sfb"></div>') + '</div>';
      $('#psteps').innerHTML = html;
      if (st.type === 'none') { $('#sgo').addEventListener('click', function(){ guided(si + 1, 0); }); return; }
      var f1 = document.querySelector('#f input'); if (f1) f1.focus();
      onSubmit(function(e){
        e.preventDefault();
        var v = readAns(st.type, 'sa');
        if (v == null) { $('#sfb').innerHTML = '<div class="fb wait">답을 써 주세요.</div>'; return; }
        if (checkAns(st.type, v, st.a)) { guided(si + 1, 0); return; }
      $('#pvis .bubble') && ($('#pvis .bubble').innerHTML = '앗, 다시 한 번 생각해 볼까요?');
        wrongs++;
        if (wrongs === 1) $('#sfb').innerHTML = '<div class="fb bad">다시 생각해 봐요.' + (st.hint ? ' 힌트: ' + st.hint : '') + '</div>';
        else { $('#sfb').innerHTML = '<div class="fb bad">이 단계의 답은 <b>' + esc(fmtAns(st.type, st.a, st.opts)) + '</b>예요.</div><div class="row" style="margin-top:8px"><button class="btn small" id="sgo" type="button">다음 단계</button></div>';
          $('#sgo').addEventListener('click', function(){ guided(si + 1, 0); }); }
      });
      return;
    }
    // 모든 단계를 마침 → 처음 문제의 답 다시 쓰기
    html += '<div class="pstep"><span class="sn">마지막</span><span>이제 처음 문제의 답을 다시 써 보세요.</span><form class="ansrow" id="f">' + ansHTML(it.type, it.opts, 'fa') + '<button class="btn" type="submit">확인</button></form><div id="sfb"></div></div>';
    $('#psteps').innerHTML = html;
    var tries = 0;
    onSubmit(function(e){
      e.preventDefault();
      var v = readAns(it.type, 'fa');
      if (v == null) { $('#sfb').innerHTML = '<div class="fb wait">답을 써 주세요.</div>'; return; }
      tries++;
      if (checkAns(it.type, v, it.a)) {
        logSave({d: 1, s: 1});
        $('#f').hidden = true;
        $('#sfb').innerHTML = '<div class="fb ok">' + cheer() + '잘했어요!' + reduceNote(it.type, v) + (it.why ? '<br>' + it.why : '') + '</div>';
        nextBtn(idx + 1 >= N ? '마치기' : '다음 문제');
      } else if (tries < 2) $('#sfb').innerHTML = '<div class="fb bad">마지막 단계의 답을 다시 확인해 보세요.</div>';
      else {
        logSave({d: 1, s: 1});
        $('#f').hidden = true;
        $('#sfb').innerHTML = '<div class="fb bad">답은 <b>' + esc(fmtAns(it.type, it.a, it.opts)) + '</b>예요.' + (it.why ? '<br>' + it.why : ' 단계를 다시 읽어 보세요.') + '</div>';
        nextBtn(idx + 1 >= N ? '마치기' : '다음 문제');
      }
    });
  }

  if (review) {
    $('#pfb').innerHTML = '<div class="fb ' + (lg.f ? 'ok' : 'wait') + '">' + (lg.f ? '바로 맞힌 문제예요.' : '풀이를 보고 해결한 문제예요.') + '</div>';
    showAll();
    nextBtn(idx + 1 < me.pp ? '다음 문제' : '지금 풀 문제로');
    return;
  }
  // 처음 풀기
  $('#pans').innerHTML = '<form class="ansrow" id="f">' + ansHTML(it.type, it.opts, 'pa') + '<button class="btn" type="submit">확인</button></form>';
  var first = document.querySelector('#f input[type=text]'); if (first) first.focus();
  onSubmit(function(e){
    e.preventDefault();
    var v = readAns(it.type, 'pa');
    if (v == null) { $('#pfb').innerHTML = '<div class="fb wait">답을 써 주세요.' + (it.type === 'frac' ? ' (분수는 위 칸에 분자, 아래 칸에 분모)' : '') + '</div>'; return; }
    $('#f').hidden = true;
    if (checkAns(it.type, v, it.a)) {
      logSave({f: 1, d: 1, s: 0});
      $('#pfb').innerHTML = '<div class="fb ok">' + cheer() + '정답!' + reduceNote(it.type, v) + (it.why ? '<br>' + it.why : '') + '</div><div class="row" style="margin-top:10px"><button class="btn ghost" id="psee">풀이 보기</button><button class="btn" id="pgo2">' + (idx + 1 >= N ? '마치기' : '다음 문제') + '</button></div>';
      $('#pgo2').addEventListener('click', goNext);
      $('#psee').addEventListener('click', function(){ $('#psee').remove(); logSave({s: 1}); showAll(); });
    } else {
      logSave({f: 0});
      $('#pfb').innerHTML = '<div class="fb bad">아쉬워요. 풀이를 보며 한 단계씩 풀어 봐요.</div><div class="row" style="margin-top:10px"><button class="btn" id="psol">풀이 보기</button></div>';
      $('#psol').addEventListener('click', function(){ $('#pfb').innerHTML = ''; guided(0, 0); });
    }
  });
}

  function stat(s){ var f = 0, so = 0; items.forEach(function(it){ var l = s.lg && s.lg[it.k]; if (practiceDone(l)) { if (l.f) f++; else so++; } }); return {f: f, s: so, n: f + so}; }
  var lockedS = Object.keys(LK).map(function(id){ var x = LK[id]; return {id: id, cls: x.cls, no: x.no, name: x.name, ch: x.ch, t: x.t}; }).filter(function(x){ return !cls || x.cls === cls; }).sort(byId);

  $('#hdr').innerHTML = '<h1>모둠 수학 <small>교사 화면 · ' + esc(T.ch.slice(1)) + ' 해결해요</small></h1><div class="who">' + (lockedS.length ? '<b>이탈 ' + lockedS.length + '명</b> · ' : '') + '자동 새로고침 중</div>';
  document.title = (lockedS.length ? '(이탈 ' + lockedS.length + ') ' : '') + '모둠 수학 교사 ' + T.ch.slice(1) + ' 해결해요';
  $('#app').className = 'wrap wide';
  $('#app').innerHTML = demoBanner() + chTabs() + tabs + alertBox +
    '<section class="card" style="margin-bottom:16px"><div class="summary">' + (cls ? '<span><b>' + esc(cls) + '</b></span>' : '') +
    '<span><b>' + done + '</b> / ' + studs.length + ' 명 완료</span><span>' + N + '문제 · 개인 학습 · 다 푼 학생만 기록돼요</span></div>' +
    '<div class="row">' + (GAS ? '<button class="btn small ghost" data-act="export">기록 시트로 저장</button>' : '') +
    (cls ? (T.confirm === 'cls' ? '<button class="btn small danger" data-act="resetcls">정말 ' + esc(cls) + ' 해결해요 기록 지우기</button><button class="btn small ghost" data-act="cancel">취소</button>'
                                : '<button class="btn small ghost" data-act="ask" data-c="cls">' + esc(cls) + '만 초기화</button>') : '') + '</div>' +
    (T.msg ? '<div class="fb ok">' + T.msg + '</div>' : '') + '</section>' + openPanel() +
    (studs.length ? '<section class="card"><h3>학생별 진행</h3><div class="scroll"><table class="ttab"><thead><tr><th>반</th><th>번호</th><th>이름</th><th>완료</th>' + '<th>이탈</th>' + '<th>비밀번호</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>'
                  : '<section class="card"><p class="muted" style="margin:0">아직 이 해결해요를 다 푼 학생이 없어요.</p></section>');

function exportPracticeRows(){
  var d = T.data, items = PRACTICE[T.ch].items;
  var rows = [['반', '번호', '이름', '완료', '완료 시각', '이탈 횟수']];
  Object.keys(d.s).map(function(id){ return d.s[id]; }).filter(function(s){ return !T.cls || s.cls === T.cls; }).sort(byId).forEach(function(s){

}

var botCount = 0;
function addBot(){
  botCount++;
  call('join', {cls: me.cls, no: 90 + botCount + Math.floor(Math.random() * 5) * 10, name: '가상친구' + botCount, gn: me.gn, bot: true}).then(poll);

function driveBots(){
  if (!started()) return;
  var ms = members(), n = ms.length;
  var it = me.st === 'ws' ? WS[me.ws] : null;
  ms.forEach(function(b, bi){
    if (!b.bot) return;
    var p = {};
    if (me.st === 'tb' && (b.st !== 'tb' || b.tb !== me.tb)) { p.st = 'tb'; p.tb = me.tb; }
    if (me.st === 'ws' && (b.st !== 'ws' || b.ws !== me.ws)) { p.st = 'ws'; p.ws = me.ws; p.ph = 'q'; }
    if (me.st === 'done' && b.st !== 'done') { p.st = 'done'; p.done = Date.now(); }
    // 데모: 가상 친구는 내가 보낸 공통 답을 따라 적음
    if (it && it.kind === 'free' && me.cl && me.cl[it.k] && JSON.stringify(b.cl && b.cl[it.k]) !== JSON.stringify(me.cl[it.k]) && Math.random() < 0.5) p['cl.' + it.k] = me.cl[it.k];
    if (it && it.kind === 'num') {
      var k = it.k;
      if (it.collab && it.collab.type === 'branch' && !(b.cl && b.cl[k]) && Math.random() < 0.4) {
        var v = {}; it.collab.letters.forEach(function(L, li){ if (li % n === bi) v[L] = it.collab.letters.filter(function(x){ return x !== L; }); });
        p['cl.' + k] = v;
      }
      if (it.collab && it.collab.type === 'opinion' && !(b.cl && b.cl[k]) && Math.random() < 0.4) p['cl.' + k] = {c: 1, r: '대표는 역할이 없어서 A·B와 B·A가 같은 경우라 달라요'};
      var gateOk = !it.collab || it.collab.type === 'pieces' || (b.cl && b.cl[k]);
      if (CODE_GAME && it.code && gateOk && !(b.dg && b.dg[k] !== undefined) && (me.ph === 'code' || Math.random() < 0.25)) {
        p['dg.' + k] = Math.floor(Math.random() * 10); p.ph = 'code';
        p['lg.' + k] = {a: it.a, f: Math.random() < 0.7 ? 1 : 0, s: 0};
      }
    }
    if (Object.keys(p).length) call('upd', {id: b.id, patch: p});
  });
}

        (T.confirm === 'pw:' + s.id ? '<button class="btn small danger" data-act="pwreset" data-id="' + esc(s.id) + '">비밀번호 초기화</button><button class="btn small ghost" data-act="cancel">취소</button>'
                                    : '<button class="linkbtn" data-act="ask" data-c="pw:' + esc(s.id) + '" title="학생이 비밀번호를 잊었을 때. 다음에 들어올 때 새로 정해요.">비번 초기화</button>') +
        (s.away ? '<button class="linkbtn" data-act="back" data-id="' + esc(s.id) + '">모둠으로 되돌리기</button>'
         : T.confirm === ck ? '<button class="btn small danger" data-act="kick" data-id="' + esc(s.id) + '">빼기 (기록은 남음)</button><button class="btn small ghost" data-act="cancel">취소</button>'
                            : '<button class="linkbtn" data-act="ask" data-c="' + ck + '" title="결석한 학생을 빼면 모둠 활동이 남은 인원으로 진행돼요. 기록은 그대로 남아요.">모둠에서 빼기</button>') + '</div></div>';
    }).join('');
    var rg = 'rg:' + g;
    return '<article class="gcard"><div class="ghead"><h3>' + esc(gLab(g)) + '</h3><span class="gstat ' + (allDone ? 'ok' : 'no') + '">' + (allDone ? '완료' : '미완료') + '</span></div>' +
      '<div class="gsub">' + ms.length + '명' + (ms.length !== act.length ? '(빠짐 ' + (ms.length - act.length) + ')' : '') + ' · ' + (grp.started ? '활동 중' : '대기실') + ' · 컴퓨터 ' + comp + '/' + ms.length + ' · 학습지 ' + pap + '/' + ms.length + '</div>' + rows +
      '<div class="gfoot">' + (!grp.started ? '<button class="btn small" data-act="start" data-g="' + esc(g) + '">지금 시작시키기</button>' : '') +
      (T.confirm === rg ? '<button class="btn small danger" data-act="resetg" data-g="' + esc(g) + '">정말 초기화</button><button class="btn small ghost" data-act="cancel">취소</button>'
                        : '<button class="btn small ghost" data-act="ask" data-c="' + rg + '">모둠 초기화</button>') + '</div></article>';
  }).join('');
  // 문제별 통계
  var stat = WS.filter(function(it){ return it.kind === 'num'; }).map(function(it){
    var n = 0, f = 0;
    Object.keys(d.s).forEach(function(id){ if (cls && d.s[id].cls !== cls) return; var l = d.s[id].lg && d.s[id].lg[it.k]; if (l && l.a !== undefined) { n++; if (l.f) f++; } });
    return '<tr><td>' + esc(it.lab) + '</td><td>' + n + '</td><td>' + f + '</td><td>' + (n - f) + '</td><td>' + (n ? Math.round(f / n * 100) + '%' : '–') + '</td></tr>';
  }).join('');
  $('#hdr').innerHTML = '<h1>모둠 수학 <small>교사 화면 · ' + esc(T.ch + ' ' + chInfo(T.ch).title) + '</small></h1><div class="who">' + (lockedS.length ? '<b>이탈 ' + lockedS.length + '명</b> · ' : '') + '자동 새로고침 중</div>';
  document.title = (lockedS.length ? '(이탈 ' + lockedS.length + ') ' : '') + '모둠 수학 교사 ' + T.ch;
  $('#app').className = 'wrap wide';
  var tabs = '<div class="clstabs">' + [''].concat(CLASSES).map(function(c){
    return '<button class="tool' + (c === cls ? ' on' : '') + '" data-act="cls" data-c="' + c + '">' + (c || '전체') + (c && clsCount[c] ? ' <span class="muted">' + clsCount[c] + '</span>' : '') + '</button>'; }).join('') + '</div>';
  var chtabs = chTabs();
  $('#app').innerHTML = demoBanner() + chtabs + tabs + alertBox +
    '<section class="card" style="margin-bottom:16px"><div class="summary">' + (cls ? '<span><b>' + esc(cls) + '</b></span>' : '') + '<span><b>' + doneG + '</b> / ' + totalG + ' 모둠 완료</span><span><b>' + compS + '</b> / ' + totalS + ' 컴퓨터 완료</span><span><b>' + paperS + '</b> / ' + totalS + ' 학습지 확인</span></div>' +
    '<p class="muted" style="margin:0;font-size:.9rem">완료 = 컴퓨터 활동을 끝내고 학습지 확인까지 받은 상태. 학생 학습지를 보고 <b>학습지 확인하기</b>를 누르세요.</p>' +
    '<div class="row">' + (GAS ? '<button class="btn small ghost" data-act="export">기록 시트로 저장</button>' : '') +
    (T.url !== null ? '<a class="btn small ghost" href="' + esc((T.url || '') + '?view=preview') + '" target="_blank" rel="noopener" style="text-decoration:none">학생 화면 미리보기 (문제 자유 이동)</a>' : '') +
    (cls ? (T.confirm === 'cls' ? '<button class="btn small danger" data-act="resetcls">정말 ' + esc(cls) + ' 기록 모두 지우기</button><button class="btn small ghost" data-act="cancel">취소</button>'
                                : '<button class="btn small ghost" data-act="ask" data-c="cls">' + esc(cls) + '만 초기화</button>')
         : (T.confirm === 'all' ? '<button class="btn small danger" data-act="resetall">정말 모든 반 기록 지우기 (되돌릴 수 없음)</button><button class="btn small ghost" data-act="cancel">취소</button>'
                                : '<button class="btn small ghost" data-act="ask" data-c="all">모든 반 초기화</button>')) + '</div>' +
    '<p class="muted" style="margin:0;font-size:.85rem">기록은 반별로 따로 남아서, 다음 시간에도 초기화하지 않고 이어서 하면 돼요. 단원을 마칠 때만 초기화하세요.</p>' +
    (T.msg ? '<div class="fb ok">' + T.msg + '</div>' : '') + '</section>' +
    openPanel() + (cards ? '<div class="tgrid">' + cards + '</div>' : '<section class="card"><p class="muted" style="margin:0">아직 들어온 학생이 없어요. 학생들이 반·번호·모둠을 고르고 들어오면 여기에 모둠별로 나타나요.</p></section>') +
    '<section class="card" style="margin-top:16px"><h3>문제별 첫 시도 결과 (짧은 설명이 필요한 문제 찾기)</h3><div class="scroll"><table><thead><tr><th>문제</th><th>푼 학생</th><th>바로 맞힘</th><th>틀려서 풀이 봄</th><th>바로 맞힌 비율</th></tr></thead><tbody>' + stat + '</tbody></table></div></section>';
}
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('[data-act]');
  if (!b || !T.pin) return;
  var act = b.dataset.act;
  if (act === 'ask') { T.confirm = b.dataset.c; renderTeacher(); }
  else if (act === 'cancel') { T.confirm = null; renderTeacher(); }
  else if (act === 'paper') tAct('t_paper', {id: b.dataset.id, v: b.dataset.v === '1'});
  else if (act === 'kick') tAct('t_away', {id: b.dataset.id, v: true});
  else if (act === 'back') tAct('t_away', {id: b.dataset.id, v: false});
  else if (act === 'unlock') tAct('t_unlock', {id: b.dataset.id});
  else if (act === 'pwreset') { var pid = b.dataset.id; tAct('t_pwreset', {id: pid}).then(function(){ T.msg = esc(pid.replace('-', ' ') + '번') + ' 비밀번호를 초기화했어요. 다음에 들어올 때 새로 정해요.'; renderTeacher(); }); }
  else if (act === 'ch') { T.ch = b.dataset.ch; T.confirm = null; T.data = {s: {}, g: {}}; try { sessionStorage.setItem('mm8-tch', T.ch); } catch(e2){} renderTeacher(); tPoll(); }
  else if (act === 'open') { call('t_open', {pin: T.pin, cls: b.dataset.c, ch: b.dataset.ch, v: b.dataset.v === '1'}).then(function(r){ T.open = r.open; renderTeacher(); }); }
  else if (act === 'cls') { T.cls = b.dataset.c; T.confirm = null; try { sessionStorage.setItem('mm81-cls', T.cls); } catch(e2){} renderTeacher(); }
  else if (act === 'resetcls') tAct('t_resetClass', {cls: T.cls});
  else if (act === 'start') tAct('t_start', {g: b.dataset.g});
  else if (act === 'resetg') tAct('t_resetGroup', {g: b.dataset.g});
  else if (act === 'resetall') tAct('t_resetAll', {});
  else if (act === 'export') exportRows();
});
function exportRows(){
  if (isPractice(T.ch)) return exportPracticeRows();
  var d = T.data, nums = WS.filter(function(it){ return it.kind === 'num'; });
  var rows = [['반', '번호', '이름', '모둠', '진행', '컴퓨터 완료', '학습지 확인', '이탈 횟수'].concat(nums.map(function(it){ return it.lab + ' 첫시도'; }))];
  Object.keys(d.s).map(function(id){ return d.s[id]; }).filter(function(s){ return !T.cls || s.cls === T.cls; }).sort(byId).forEach(function(s){
    rows.push([s.cls || '', s.no || '', s.name, (s.gn || s.g) + '모둠' + (s.away ? '(빠짐)' : ''), stuProgress(s), s.st === 'done' ? 'O' : 'X', s.paper ? 'O' : 'X', s.lv || 0].concat(nums.map(function(it){ var l = s.lg && s.lg[it.k]; return l && l.a !== undefined ? (l.f ? 'O' : 'X') : ''; })));
  });
  T.msg = '저장 중…'; renderTeacher();
  google.script.run.withSuccessHandler(function(url){ T.msg = '저장했어요: <a href="' + esc(url) + '" target="_blank">기록 시트 열기</a>'; renderTeacher(); })
    .withFailureHandler(function(err){ T.msg = '저장하지 못했어요: ' + esc(err); renderTeacher(); }).exportSheet(T.pin, rows, T.ch + (T.cls ? ' ' + T.cls : ''));
}

// ===================== 시작 =====================
function boot(view){
  if (VC && view === 'teacher') { location.href = 'teacher.html'; return; }
  if (VC && view !== 'preview') DKEY = 'mm8-dev';
  if (view === 'preview') { PREVIEW = true; DKEY = 'mm8-preview'; }
  if (view === 'teacher') {
    // 미리보기 링크 주소: 데모는 지금 파일, 실제는 웹앱 주소
    T.url = GAS ? null : '';
    if (GAS) google.script.run.withSuccessHandler(function(u){ T.url = u || ''; if (T.data) renderTeacher(); }).appUrl();
    var p = null; try { p = sessionStorage.getItem('mm81-pin'); } catch(e){}
    if (p) { T.pin = p; call('t_all', {pin: p, ch: T.ch}).then(function(r){ T.data = r; loadOpen(); renderTeacher(); T.timer = setInterval(tPoll, GAS ? 3000 : 1000); }).catch(function(){ renderTeacherLogin(); }); }
    else renderTeacherLogin();
    return;
  }
  // 이전에 들어온 적 있으면 자동으로 이어서
  // (탭마다 따로 기억 → 데모에서 탭 여러 개로 여러 학생 흉내 가능. 창을 닫았다면 같은 반·번호·이름으로 다시 들어오면 이어서 해요.)
  var saved = loadCur();
  if (saved && saved.p) {
    PROFILE = saved.p;
    if (saved.ch) return enterChapter(saved.ch);
  }
  render();
}
if (GAS) google.script.url.getLocation(function(loc){ boot(loc.parameter.view); });
else boot(new URLSearchParams(location.search).get('view'));
</script>
