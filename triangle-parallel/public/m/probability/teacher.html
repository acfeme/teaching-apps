<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확률 수업 교사 화면</title>
<style>
:root{--board:#1f4d3a;--chalk:#f4c84a;--ink:#1d2621;--muted:#5d6b63;--line:#d9e1dc;--paper:#fff;--bg:#f4f6f2;--ok:#1b7f4b;--ok-bg:#e7f6ec;--wait:#9a6b00;--wait-bg:#fff6dc;--bad:#c0392b;--bad-bg:#fdeeee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
header{background:var(--board);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
header h1{margin:0;font-size:1.25rem}
header h1 small{color:var(--chalk);font-size:.85rem;margin-left:6px}
header a{color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;font:inherit;font-weight:700;color:var(--ink)}
.tab.on{background:var(--board);border-color:var(--board);color:#fff}
.btn{border:0;background:var(--board);color:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--board);border:2px solid var(--board)}
.btn.danger{background:var(--bad)}
.btn.small{padding:4px 10px;font-size:.85rem}
select{font:inherit;padding:6px 8px;border:2px solid var(--line);border-radius:10px}
input[type=password]{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;width:min(320px,100%)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:700}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.wait{background:var(--wait-bg);color:var(--wait)}
.pill.no{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;font-size:.93rem;white-space:nowrap}
th{font-size:.82rem;color:var(--muted)}
.opengrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ocell{border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;cursor:pointer;background:var(--paper);font:inherit}
.ocell.on{border-color:var(--ok);background:var(--ok-bg)}
.ocell b{display:block}
.summary{display:flex;gap:18px;flex-wrap:wrap;font-size:1.05rem}
.fb{padding:8px 12px;border-radius:10px;margin-top:8px}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
</style>
</head>
<body>
<header><h1>확률 수업 <small>교사 화면</small></h1><div class="row" id="links"></div></header>
<main class="wrap" id="app"></main>
<script>
var CLASSES = ['1반', '2반', '3반', '4반', 'A반', 'B반', 'C반'];
var CHS = [{id: '8.1', t: '8.1 수업'}, {id: 'P8.1', t: '8.1 해결해요'}, {id: 'P8.2', t: '8.2 해결해요'}, {id: 'P8.3', t: '8.3 해결해요'}, {id: 'P8.4', t: '8.4 해결해요'}];
function ss(k, v){ try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch(e){ return null; } }
var S = {pw: ss('prob-pw'), ch: ss('prob-ch') || '8.1', cls: ss('prob-cls') || '', data: null, msg: '', confirm: null, timer: null};
var $ = function(q){ return document.querySelector(q); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function hm(t){ if (!t) return ''; var d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function api(method, q, body){
  return fetch('/api/prob' + (q || ''), {method: method, cache: 'no-store', headers: {'Content-Type': 'application/json', 'x-admin-password': S.pw || ''}, body: body ? JSON.stringify(body) : undefined})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok) { var e = new Error(j.error || ('오류 ' + r.status)); e.status = r.status; throw e; } return j; }); });
}
$('#links').innerHTML = '<a href="index.html" target="_blank">학생 화면</a><a href="index.html?view=preview" target="_blank">미리보기(기록 안 됨)</a>';

function renderLogin(msg){
  stop();
  $('#app').innerHTML = '<section class="card"><h2>선생님 비밀번호</h2><p class="muted" style="margin-top:0">닮음 탐구 교실 관리자 비밀번호와 같아요.</p>' +
    '<form class="row" id="lf"><input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호"><button class="btn" type="submit">열기</button></form>' +
    (msg ? '<div class="fb bad">' + esc(msg) + '</div>' : '') + '</section>';
  $('#pw').focus();
  $('#lf').addEventListener('submit', function(e){
    e.preventDefault(); S.pw = $('#pw').value;
    api('GET', '?op=check').then(function(){ ss('prob-pw', S.pw); load(); start(); }).catch(function(err){ S.pw = null; renderLogin(err.message); });
  });
}
function start(){ stop(); S.timer = setInterval(load, 10000); }
function stop(){ if (S.timer) clearInterval(S.timer); S.timer = null; }
function load(){
  return api('GET', '?op=all&ch=' + encodeURIComponent(S.ch)).then(function(j){ S.data = j; render(); })
    .catch(function(err){ if (err.status === 401 || err.status === 429) { ss('prob-pw', null); S.pw = null; renderLogin(err.message); } else { S.msg = '불러오지 못했어요: ' + err.message; render(); } });
}
function isLesson(){ return S.ch === '8.1'; }
function stLabel(r){
  if (r.st === 'done') return '<span class="pill ok">완료</span> <span class="muted">' + hm(r.done) + '</span>';
  if (!isLesson()) return '<span class="pill wait">미완료</span>';
  return r.st === 's1' ? '<span class="pill wait">1단계 완료 · 학습지 푸는 중</span>' : '<span class="pill wait">1단계(교과서) 푸는 중</span>';
}
function rowsOf(){
  var recs = (S.data && S.data.recs) || {};
  return Object.keys(recs).map(function(id){ var p = id.split(':'); return {id: id, cls: p[0], no: Number(p[1]), r: recs[id]}; })
    .filter(function(x){ return !S.cls || x.cls === S.cls; })
    .sort(function(a, b){ return CLASSES.indexOf(a.cls) - CLASSES.indexOf(b.cls) || a.no - b.no; });
}
function render(){
  if (!S.data) { $('#app').innerHTML = '<p class="muted">불러오는 중…</p>'; return; }
  var rows = rowsOf(), done = rows.filter(function(x){ return x.r.st === 'done'; }).length, lesson = isLesson();
  var open = S.data.open || {};
  var chTabs = '<div class="tabs">' + CHS.map(function(c){ return '<button class="tab' + (c.id === S.ch ? ' on' : '') + '" data-ch="' + c.id + '">' + c.t + '</button>'; }).join('') + '</div>';
  var clsTabs = '<div class="tabs">' + [''].concat(CLASSES).map(function(c){ return '<button class="tab' + (c === S.cls ? ' on' : '') + '" data-cls="' + c + '">' + (c || '전체') + '</button>'; }).join('') + '</div>';
  var cur = CHS.filter(function(c){ return c.id === S.ch; })[0];
  var grid = '<section class="card"><h3>' + esc(cur.t) + ' · 반별 열기/잠그기</h3><div class="opengrid">' + CLASSES.map(function(c){
      var on = open[c] && open[c][S.ch];
      return '<button class="ocell' + (on ? ' on' : '') + '" data-open="' + c + '" data-v="' + (on ? 0 : 1) + '"><b>' + c + '</b>' + (on ? '<span class="pill ok">열림</span>' : '<span class="pill no">잠김</span>') + '</button>'; }).join('') + '</div>' +
    '<div class="row" style="margin-top:10px"><button class="btn small ghost" data-open="all" data-v="1">모든 반 열기</button><button class="btn small ghost" data-open="all" data-v="0">모든 반 잠그기</button></div></section>';
  var body = rows.map(function(x){
    var r = x.r;
    return '<tr><td>' + esc(x.cls) + '</td><td>' + x.no + '</td><td><b>' + esc(r.name) + '</b></td><td>' + stLabel(r) + '</td>' +
      '<td>' + (r.lv ? '<span class="pill no">' + r.lv + '회</span>' : '<span class="muted">0</span>') + '</td>' +
      (lesson ? '<td><button class="btn small ' + (r.paper ? '' : 'ghost') + '" data-paper="' + esc(x.id) + '" data-v="' + (r.paper ? 0 : 1) + '">' + (r.paper ? '확인함 ✓' : '확인') + '</button></td>' : '') +
      '<td>' + (S.confirm === 'pw:' + x.id ? '<button class="btn small danger" data-pwreset="' + esc(x.id) + '">초기화</button> <button class="btn small ghost" data-cancel>취소</button>' : '<button class="btn small ghost" data-ask="pw:' + esc(x.id) + '">비번 초기화</button>') + '</td>' +
      '<td>' + (S.confirm === 'del:' + x.id ? '<button class="btn small danger" data-del="' + esc(x.id) + '">지우기</button> <button class="btn small ghost" data-cancel>취소</button>' : '<button class="btn small ghost" data-ask="del:' + esc(x.id) + '">기록 지우기</button>') + '</td></tr>';
  }).join('');
  var table = rows.length
    ? '<div class="scroll"><table><thead><tr><th>반</th><th>번호</th><th>이름</th><th>' + (lesson ? '진행' : '완료') + '</th><th>이탈</th>' + (lesson ? '<th>학습지</th>' : '') + '<th>비밀번호</th><th></th></tr></thead><tbody>' + body + '</tbody></table></div>'
    : '<p class="muted" style="margin:0">' + (lesson ? '아직 시작한 학생이 없어요.' : '아직 다 푼 학생이 없어요.') + '</p>';
  var resetBtn = S.cls ? (S.confirm === 'cls' ? '<button class="btn small danger" data-delcls>정말 ' + esc(S.cls) + ' 기록 모두 지우기</button><button class="btn small ghost" data-cancel>취소</button>' : '<button class="btn small ghost" data-ask="cls">' + esc(S.cls) + ' 기록 모두 지우기</button>') : '';
  $('#app').innerHTML = chTabs + clsTabs + grid +
    '<section class="card"><div class="summary"><span><b>' + done + '</b> / ' + rows.length + '명 완료</span><span class="muted">' + (lesson ? '시작한 학생이 나와요 · 10초마다 새로고침' : '다 푼 학생만 기록돼요 · 10초마다 새로고침') + '</span></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn small ghost" data-csv>CSV로 내려받기</button>' + resetBtn + '<button class="btn small ghost" data-logout>잠그기(로그아웃)</button></div>' +
    (S.msg ? '<div class="fb ok">' + S.msg + '</div>' : '') + '</section>' +
    '<section class="card"><h3>학생 기록</h3>' + table + '</section>' +
    '<section class="card"><h3>학생 비밀번호 초기화</h3><p class="muted" style="margin-top:0">비밀번호를 잊은 학생은 초기화하면 다음에 들어올 때 새로 정해요. 푼 기록은 그대로예요.</p>' +
    '<form class="row" id="pwf"><select id="pwcls">' + CLASSES.map(function(c){ return '<option' + (c === S.cls ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>' +
    '<select id="pwno">' + Array.from({length: 35}, function(_, i){ return '<option value="' + (i + 1) + '">' + (i + 1) + '번</option>'; }).join('') + '</select>' +
    '<button class="btn small" type="submit">비밀번호 초기화</button></form></section>';
}
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('button'); if (!b) return;
  var d = b.dataset; S.msg = '';
  if (d.ch) { S.ch = d.ch; ss('prob-ch', S.ch); S.confirm = null; S.data = null; render(); load(); }
  else if (d.cls !== undefined) { S.cls = d.cls; ss('prob-cls', S.cls); S.confirm = null; render(); }
  else if (d.open) { api('POST', '', {op: 'open', cls: d.open, ch: S.ch, v: d.v === '1'}).then(function(j){ S.data.open = j.open; render(); }).catch(function(err){ S.msg = err.message; render(); }); }
  else if (d.paper) { api('POST', '', {op: 'paper', ch: S.ch, id: d.paper, v: d.v === '1'}).then(load).catch(function(err){ S.msg = err.message; render(); }); }
  else if (d.pwreset) { S.confirm = null; var pp = d.pwreset.split(':'); api('POST', '', {op: 'pwreset', cls: pp[0], no: Number(pp[1])}).then(function(){ S.msg = pp[0] + ' ' + pp[1] + '번 비밀번호를 초기화했어요.'; render(); }).catch(function(err){ S.msg = err.message; render(); }); }
  else if (d.ask) { S.confirm = d.ask; render(); }
  else if (d.cancel !== undefined) { S.confirm = null; render(); }
  else if (d.del) { S.confirm = null; api('POST', '', {op: 'del', ch: S.ch, id: d.del}).then(load).catch(function(err){ S.msg = err.message; render(); }); }
  else if (d.delcls !== undefined) { S.confirm = null; api('POST', '', {op: 'del', ch: S.ch, cls: S.cls}).then(function(j){ S.msg = (j.n || 0) + '명의 기록을 지웠어요.'; return load(); }).catch(function(err){ S.msg = err.message; render(); }); }
  else if (d.csv !== undefined) {
    var lesson = isLesson(), rows = rowsOf();
    var lines = [['반', '번호', '이름', lesson ? '진행' : '완료', '완료 시각', '이탈 횟수'].concat(lesson ? ['학습지 확인'] : [])].concat(rows.map(function(x){
      var r = x.r, st = r.st === 'done' ? '완료' : lesson ? (r.st === 's1' ? '1단계 완료' : '1단계 중') : '미완료';
      return [x.cls, x.no, r.name, st, r.done ? new Date(r.done).toLocaleString('ko-KR') : '', r.lv || 0].concat(lesson ? [r.paper ? 'O' : 'X'] : []);
    }));
    var csv = '﻿' + lines.map(function(l){ return l.map(function(v){ v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
    a.download = '확률 ' + (CHS.filter(function(c){ return c.id === S.ch; })[0].t) + (S.cls ? ' ' + S.cls : '') + '.csv'; a.click();
  }
  else if (d.logout !== undefined) { ss('prob-pw', null); S.pw = null; renderLogin(); }
});
document.addEventListener('submit', function(e){
  if (e.target.id !== 'pwf') return;
  e.preventDefault();
  var c = $('#pwcls').value, n = Number($('#pwno').value);
  api('POST', '', {op: 'pwreset', cls: c, no: n}).then(function(){ S.msg = c + ' ' + n + '번 비밀번호를 초기화했어요.'; render(); }).catch(function(err){ S.msg = err.message; render(); });
});
if (S.pw) { load().then(start); } else renderLogin();
</script>
</body>
</html>
