<title>도형의 닮음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  --paper:#F4FAFF; --grid:#D3E8F7; --ink:#1F2A44; --sun:#FFD93D; --blue:#1D4ED8;
  --mint:#2DBE7E; --coral:#FF6B4A; --violet:#7C3AED;
  --display:'Jua','Gowun Dodum',sans-serif; --body:'Gowun Dodum','Jua',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:56px 56px;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}

/* ---- 목록 ---- */
#home{flex:1;min-height:0;display:flex;flex-direction:column;padding:clamp(10px,2vw,28px) max(16px,env(safe-area-inset-right)) max(clamp(10px,1.6vw,22px),env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:baseline;gap:clamp(10px,1.6vw,22px);margin-bottom:clamp(8px,1.4vw,18px)}
.title{font-family:var(--display);font-size:clamp(26px,4vw,62px);background:var(--sun);border:4px solid var(--ink);border-radius:18px;padding:2px clamp(14px,2vw,30px);transform:rotate(-2deg);box-shadow:6px 6px 0 var(--ink);white-space:nowrap}
.sub{font-family:var(--display);font-size:clamp(14px,1.8vw,28px);opacity:.6}
.made{font-family:var(--display);font-size:clamp(20px,3vw,46px);color:var(--ink);white-space:nowrap}
#cards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:clamp(8px,1.4vw,22px)}
.c{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:.25em;text-align:left;
  background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--ink);
  padding:clamp(8px,1.4vw,22px);cursor:pointer;font-family:var(--display);color:var(--ink);min-width:0;transition:transform .12s}
.c:active{transform:translate(4px,4px);box-shadow:3px 3px 0 var(--ink)}
.c:nth-child(odd){transform:rotate(-.7deg)} .c:nth-child(even){transform:rotate(.7deg)}
.c:nth-child(odd):active{transform:rotate(-.7deg) translate(4px,4px)} .c:nth-child(even):active{transform:rotate(.7deg) translate(4px,4px)}
.c .n{width:1.7em;height:1.7em;border-radius:999px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font-size:clamp(14px,1.7vw,26px);background:var(--sun);line-height:1}
.c .tw{display:flex;flex-direction:column;gap:.2em}
.c .t{font-size:clamp(17px,2.3vw,38px);line-height:1.1}
.c .d{font-family:var(--body);font-size:clamp(11px,1.3vw,21px);opacity:.62;line-height:1.3}
.c.g1 .n{background:var(--sun)} .c.g2 .n{background:#BFE3FF} .c.g3 .n{background:#D9CCFF} .c.g4 .n{background:#B9F0D4}

/* ---- 보기 ---- */
#view{flex:1;min-height:0;display:none;flex-direction:column}
#view.on{display:flex}
#bar{flex:none;display:flex;align-items:center;gap:clamp(6px,1vw,14px);padding:clamp(4px,.6vw,8px) max(10px,env(safe-area-inset-left))}
#bar .b{border:3px solid var(--ink);background:#fff;border-radius:999px;font:400 clamp(13px,1.6vw,24px) var(--display);color:var(--ink);
  padding:clamp(2px,.35vw,6px) clamp(10px,1.3vw,20px);cursor:pointer;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
#bar .b:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#bar .b:disabled{opacity:.3;cursor:default}
#vt{flex:1;min-width:0;font-family:var(--display);font-size:clamp(14px,1.8vw,28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75}
#fr{flex:1;min-height:0;width:100%;border:0;display:block;background:var(--paper)}
@media (prefers-reduced-motion:reduce){.c{transition:none}}
</style>

<div id="app">
  <div id="home">
    <div class="top"><div class="title">도형의 닮음</div><div class="sub">중2 · 수업용</div><div class="made">이송원 제작</div></div>
    <div id="cards"></div>
  </div>
  <div id="view">
    <div id="bar">
      <button class="b" id="back" type="button">☰ 목록</button>
      <button class="b" id="prev" type="button">‹</button>
      <button class="b" id="next" type="button">›</button>
      <div id="vt"></div>
    </div>
    <iframe id="fr" title="수업 화면"></iframe>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const SC=[
 {f:'s1.html',t:'닮음이란?',d:'작은 도형을 큰 도형에 포개고 늘려서 확인',g:1},
 {f:'s2.html',t:'닮음 찾기',d:'도형 안에서 닮은 두 삼각형 찾아 포개 보기',g:1},
 {f:'s3.html',t:'닮음비',d:'대응변 : 대응변 — 정의와 문제 세 개',g:2},
 {f:'s4.html',t:'헷갈리지 않기',d:'변의 비가 같아도 닮음이 아닌 경우',g:2},
 {f:'s5.html',t:'입체의 닮음',d:'구름에 가려진 면의 모양 알아맞히기',g:3},
 {f:'s6.html',t:'넓이비',d:'닮음비 a : b  →  넓이비 a² : b²',g:3},
 {f:'s7.html',t:'부피비',d:'닮음비 a : b  →  부피비 a³ : b³',g:4},
 {f:'s8.html',t:'짝맞추기 게임',d:'카드 18장, 몇 초 만에 클리어?',g:4},
 {f:'s9.html',t:'닮은 삼각형 찾기',d:'삼각형 9개를 포개 보며 닮음 조건 이끌어 내기',g:4}
];
let cur=-1;
$('#cards').innerHTML=SC.map((s,i)=>
  `<button class="c g${s.g}" data-i="${i}" type="button"><span class="n">${i+1}</span><span class="tw"><span class="t">${s.t}</span><span class="d">${s.d}</span></span></button>`).join('');
function open(i){
  cur=i;$('#home').style.display='none';$('#view').classList.add('on');
  $('#fr').src=SC[i].f;$('#vt').textContent=`${i+1}. ${SC[i].t}`;
  $('#prev').disabled=i===0;$('#next').disabled=i===SC.length-1}
function home(){cur=-1;$('#view').classList.remove('on');$('#home').style.display='flex';$('#fr').removeAttribute('src')}
$('#cards').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)open(+b.dataset.i)});
$('#back').onclick=home;
$('#prev').onclick=()=>{if(cur>0)open(cur-1)};
$('#next').onclick=()=>{if(cur<SC.length-1)open(cur+1)};
addEventListener('keydown',e=>{
  if(cur<0)return;
  if(e.key==='Escape')home();
  else if(e.key==='ArrowLeft'&&cur>0)open(cur-1);
  else if(e.key==='ArrowRight'&&cur<SC.length-1)open(cur+1)});
</script>
