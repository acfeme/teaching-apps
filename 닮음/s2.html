<style>
/* Layout: graph-paper stage. Left = the problem figure (tap two triangles), right = dashed card where copies fly in and get overlapped. Header: sticker title, problem 1-3, short live hint. Footer: chips + overlap button. */
:root{
  --paper:#F4FAFF; --grid:#D3E8F7; --ink:#1F2A44; --coral:#FF6B4A; --sky:#4DA3FF; --mint:#2DBE7E; --sun:#FFD93D; --red:#E5383B;
  --display:'Jua','Gowun Dodum',sans-serif; --body:'Gowun Dodum','Jua',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:56px 56px;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;flex-direction:column;gap:clamp(2px,.5vw,8px);padding:clamp(8px,1.3vw,18px) max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left))}
.hrow{display:flex;align-items:center;gap:clamp(10px,1.6vw,24px)}
.note{font-family:'Jua',sans-serif;font-size:clamp(19px,2.7vw,42px);color:#E5383B;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.by{font-family:'Jua',sans-serif;font-size:clamp(11px,1.25vw,20px);opacity:.5;white-space:nowrap;flex:none;letter-spacing:-.01em}
.tag{font-family:var(--display);font-size:clamp(20px,2.6vw,40px);background:var(--sun);border:3px solid var(--ink);border-radius:14px;padding:2px clamp(12px,1.6vw,24px);white-space:nowrap;transform:rotate(-3deg);box-shadow:4px 4px 0 var(--ink)}
.probs{display:flex;gap:clamp(6px,.8vw,12px)}
.probs button{width:clamp(40px,4.6vw,66px);height:clamp(40px,4.6vw,66px);border-radius:50%;border:3px solid var(--ink);background:#fff;font:400 clamp(20px,2.6vw,38px) var(--display);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink);padding:0}
.probs button.on{background:var(--coral);color:#fff}
#hint{flex:1;min-width:0;font-family:var(--display);font-size:clamp(22px,3.1vw,48px);line-height:1.2}
#hint{white-space:nowrap}

function info(p){const n=p.length;return{s:p.map((a,i)=>Math.hypot(p[(i+1)%n][0]-a[0],p[(i+1)%n][1]-a[1])),g:p.map((a,i)=>{const u=[p[(i+n-1)%n][0]-a[0],p[(i+n-1)%n][1]-a[1]],w=[p[(i+1)%n][0]-a[0],p[(i+1)%n][1]-a[1]];return Math.acos(Math.max(-1,Math.min(1,(u[0]*w[0]+u[1]*w[1])/(Math.hypot(...u)*Math.hypot(...w)))))*180/Math.PI})}}
function simPoly(P,Q){if(P.length!==Q.length)return{sim:false};const n=P.length,a=info(P),b=info(Q);
  for(const rev of[false,true])for(let s=0;s<n;s++){const m=i=>rev?(((s-i)%n)+n)%n:(s+i)%n,sj=i=>rev?m(i+1):m(i);let ok=true;
    for(let i=0;i<n;i++)if(Math.abs(a.g[i]-b.g[m(i)])>1.5)ok=false;const r0=b.s[sj(0)]/a.s[0];
    for(let i=0;i<n;i++)if(Math.abs(b.s[sj(i)]/a.s[i]-r0)>.02*r0)ok=false;
    if(ok)return{sim:true,map:[...Array(n).keys()].map(m),k:r0}}
  return{sim:false}}

/* ---- 포개기: 대응(순환·뒤집기)을 모두 시험해 가장 잘 맞는 이동·회전·확대를 찾는다 ---- */
function fitPoly(P,Q){const n=P.length;let best=null;
  for(const rev of[false,true])for(let s=0;s<n;s++)for(const refl of[false,true]){
    const m=i=>rev?(((s-i)%n)+n)%n:(s+i)%n,Z=P.map(p=>[p[0],refl?-p[1]:p[1]]),W=P.map((_,i)=>Q[m(i)]),zc=cen(Z),wc=cen(W);
    let n0=0,n1=0,d=0;Z.forEach((z,i)=>{const zr=z[0]-zc[0],zi=z[1]-zc[1],wr=W[i][0]-wc[0],wi=W[i][1]-wc[1];n0+=zr*wr+zi*wi;n1+=zr*wi-zi*wr;d+=zr*zr+zi*zi});
    const a=[n0/d,n1/d];let res=0;Z.forEach((z,i)=>{const zr=z[0]-zc[0],zi=z[1]-zc[1],x=a[0]*zr-a[1]*zi+wc[0],y=a[0]*zi+a[1]*zr+wc[1];res=Math.max(res,Math.hypot(x-W[i][0],y-W[i][1]))});
    if(!best||res<best.res)best={res,a,refl,m,wc,pc:cen(P)}}
  const sc=Math.hypot(...best.a),th=Math.atan2(best.a[1],best.a[0]);
  best.frame=u=>{const k=1+(sc-1)*u,t=th*u,c=Math.cos(t),s=Math.sin(t),fy=best.refl?1-2*u:1,cx=best.pc[0]+(best.wc[0]-best.pc[0])*u,cy=best.pc[1]+(best.wc[1]-best.pc[1])*u;
    return P.map(p=>{const x=p[0]-best.pc[0],y=(p[1]-best.pc[1])*fy;return[cx+k*(x*c-y*s),cy+k*(x*s+y*c)]})};
  return best}

/* ---- 그리기 ---- */
function lab(pts,i,off,col,t,fs){const c=cen(pts),dx=pts[i][0]-c[0],dy=pts[i][1]-c[1],l=Math.hypot(dx,dy)||1;
  return `<text x="${pts[i][0]+dx/l*off}" y="${pts[i][1]+dy/l*off+fs*.35}" text-anchor="middle" font-family="Jua,sans-serif" font-size="${fs}" fill="${col}" pointer-events="none">${t}</text>`}
function confetti(){const cols=['#FF6B4A','#FFD93D','#2DBE7E','#4DA3FF','#B26BFF'];let s='';
  for(let i=0;i<22;i++){const x=1000+Math.random()*540,y=110+Math.random()*40,c=cols[i%5],d=(Math.random()*.5).toFixed(2);
    s+=i%2?`<rect class="conf" x="${x}" y="${y}" width="16" height="16" rx="3" fill="${c}" style="animation-delay:${d}s"/>`:`<circle class="conf" cx="${x}" cy="${y}" r="9" fill="${c}" style="animation-delay:${d}s"/>`}return s}
const uvec=(P,V)=>{const d=[P[0]-V[0],P[1]-V[1]],l=Math.hypot(d[0],d[1])||1;return[d[0]/l,d[1]/l]};
function rtMark(V,A,B,q,w){const u=uvec(A,V),z=uvec(B,V);
  const p1=[V[0]+u[0]*q,V[1]+u[1]*q],p2=[V[0]+z[0]*q,V[1]+z[1]*q];
  return `<path d="M${p1[0]} ${p1[1]}L${p1[0]+p2[0]-V[0]} ${p1[1]+p2[1]-V[1]}L${p2[0]} ${p2[1]}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" pointer-events="none"/>`}
function eqMark(V,A,B,r,w){const u=uvec(A,V),z=uvec(B,V),C='#7C3AED';
  const a1=Math.atan2(u[1],u[0]);let d=Math.atan2(z[1],z[0])-a1;
  while(d<=-Math.PI)d+=2*Math.PI;while(d>Math.PI)d-=2*Math.PI;
  const p1=[V[0]+u[0]*r,V[1]+u[1]*r],p2=[V[0]+z[0]*r,V[1]+z[1]*r],mb=a1+d/2;
  return `<path d="M${p1[0]} ${p1[1]}A${r} ${r} 0 0 ${d>0?1:0} ${p2[0]} ${p2[1]}" fill="none" stroke="${C}" stroke-width="${w}" pointer-events="none"/>`
   +`<circle cx="${V[0]+Math.cos(mb)*r}" cy="${V[1]+Math.sin(mb)*r}" r="${w*1.4}" fill="${C}" pointer-events="none"/>`}
function marks(){const m=FIG.mk;if(!m)return '';let s='';
  (m.rt||[]).forEach(([v,a,b])=>{s+=rtMark(L.P[v],L.P[a],L.P[b],26,6)});
  (m.eq||[]).forEach(([v,a,b])=>{s+=eqMark(L.P[v],L.P[a],L.P[b],76,8)});
  (m.par||[]).forEach(([a,b])=>{const A=L.P[a],B=L.P[b],mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2;
    const d=uvec(B,A),n=[-d[1],d[0]],w=14,h=16;
    s+=`<path d="M${mx-d[0]*h+n[0]*w} ${my-d[1]*h+n[1]*w}L${mx+d[0]*h} ${my+d[1]*h}L${mx-d[0]*h-n[0]*w} ${my-d[1]*h-n[1]*w}" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`});
  return s}
function copyMarks(it){const sp=FIG.pm&&it.lab&&FIG.pm[it.lab.join('')];if(!sp)return '';
  const xs=it.pts.map(p=>p[0]),ys=it.pts.map(p=>p[1]);
  const sz=Math.min(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
  const q=Math.max(12,Math.min(26,sz*.14)),r=Math.max(28,Math.min(76,sz*.34)),w=Math.max(4,Math.min(8,sz*.035));
  const at=k=>it.pts[it.lab.indexOf(k)];let s='';
  (sp.rt||[]).forEach(([v,a,b])=>{s+=rtMark(at(v),at(a),at(b),q,w)});
  (sp.eq||[]).forEach(([v,a,b])=>{s+=eqMark(at(v),at(a),at(b),r,w)});
  return s}
function draw(){
  let s='';const order=FIG.polys.map((_,i)=>i).sort((a,b)=>area(polyPx(FIG.polys[b]))-area(polyPx(FIG.polys[a])));
  order.forEach(i=>{const k=st.sel.indexOf(i),c=k>=0?SEL[k]:'#fff';s+=`<polygon data-p="${i}" points="${ps(polyPx(FIG.polys[i]))}" fill="${c}" fill-opacity="${k>=0?.4:.001}" stroke="none"/>`});
  FIG.segs.forEach(g=>{const a=L.P[g[0]],b=L.P[g[1]];s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${INK}" stroke-width="8" stroke-linecap="round" pointer-events="none"/>`});
  st.sel.forEach((i,k)=>{s+=`<polygon points="${ps(polyPx(FIG.polys[i]))}" fill="none" stroke="${SEL[k]}" stroke-width="10" stroke-linejoin="round" pointer-events="none"/>`});
  s+=marks();
  const cc=cen(Object.values(L.P));
  Object.keys(L.P).forEach(k=>{const p=L.P[k],lo=FIG.lo[k];const dx=p[0]-cc[0],dy=p[1]-cc[1],l=Math.hypot(dx,dy)||1;
    const x=lo?p[0]+lo[0]:p[0]+dx/l*38,y=lo?p[1]+lo[1]:p[1]+dy/l*38;
    s+=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${INK}" pointer-events="none"/><text x="${x}" y="${y+15}" text-anchor="middle" font-family="Jua,sans-serif" font-size="46" fill="${INK}" pointer-events="none">${k}</text>`});
  // 오른쪽 카드
  s+=`<rect x="925" y="60" width="650" height="640" rx="26" fill="rgba(255,255,255,.55)" stroke="${INK}" stroke-width="4" stroke-dasharray="14 12" pointer-events="none"/>`;
  const g=st.stage;
  if(g){g.items.forEach(it=>{const done=st.phase==='done',ok=done&&st.res&&st.res.sim,col=ok?MINT:it.col;
      s+=`<polygon points="${ps(it.pts)}" fill="${col}" fill-opacity=".35" stroke="${col}" stroke-width="9" stroke-linejoin="round" pointer-events="none"/>`;
      s+=copyMarks(it);
      if(it.lab&&!(it.mover&&g.u2>.7))it.pts.forEach((p,i)=>{s+=lab(it.pts,i,34,col,it.lab[i],36)})});
    if(st.phase==='done'&&st.res&&!st.res.sim&&g.gaps)g.gaps.forEach(q=>{s+=`<line x1="${q[0][0]}" y1="${q[0][1]}" x2="${q[1][0]}" y2="${q[1][1]}" stroke="${RED}" stroke-width="7" stroke-linecap="round" pointer-events="none"/>`});
    if(st.phase==='done'&&st.res&&st.res.left){const R=st.res,fs=76,Y=648,GX=60,SW=98,hh=SW/SIMAR;
      R.dots.forEach((p,i)=>{if(p)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="15" fill="${PAIR[i]}" stroke="#fff" stroke-width="4" pointer-events="none"/>`});
      const sp=(arr,anchor,x)=>`<text x="${x}" y="${Y}" text-anchor="${anchor}" font-family="Jua,sans-serif" font-size="${fs}" fill="${INK}" pointer-events="none">${R.sym}${arr.map((ch,i)=>`<tspan fill="${PAIR[i]}">${ch}</tspan>`).join('')}</text>`;
      s+=sp(R.left,'end',1250-GX)+sp(R.right,'start',1250+GX)+`<image href="${SIMPNG}" x="${1250-SW/2}" y="${Y-fs*0.32-hh/2}" width="${SW}" height="${hh}" preserveAspectRatio="none" pointer-events="none"/>`}
    if(st.burst){s+=confetti();st.burst=0}}
  $('#sv').innerHTML=s;ui()}
function ui(){
  const h=$('#hint');h.className='';let t;
  if(st.phase==='anim')t='움직이는 중…';
  else if(st.phase==='rotated')t='포개졌어요! 확대하면 맞을까요?';
  else if(st.phase==='done'){h.className=st.res.sim?'ok':'no';t=st.res.sim?'닮음이에요!':'닮음이 아니에요'}
  else t=st.sel.length===0?'닮음인 두 도형은?':st.sel.length===1?'하나 더 골라 보세요':'포개 볼까요?';
  h.innerHTML=t;
  $('#chips').innerHTML=FIG.polys.map((d,i)=>`<button data-p="${i}" class="${st.sel[0]===i?'a':st.sel[1]===i?'b':''}">${d[0]}</button>`).join('');
  const go=$('#go');go.disabled=!(st.sel.length===2&&st.phase!=='anim');go.textContent=st.phase==='done'?'다시 포개 보기':st.phase==='rotated'?'확대하기':'포개 보기'}

/* ---- 선택 ---- */
function reset(){cancelAnimationFrame(raf);st.sel=[];st.phase='idle';st.stage=null;st.res=null;draw()}
function toggle(i){if(st.phase==='anim')return;const at=st.sel.indexOf(i);if(at>=0)st.sel.splice(at,1);else{st.sel.push(i);if(st.sel.length>2)st.sel.shift()}st.phase='idle';st.stage=null;st.res=null;draw()}
function inPoly(p,a){let c=false;for(let i=0,j=a.length-1;i<a.length;j=i++){if((a[i][1]>p[1])!==(a[j][1]>p[1])&&p[0]<(a[j][0]-a[i][0])*(p[1]-a[i][1])/(a[j][1]-a[i][1])+a[i][0])c=!c}return c}
const sv=$('#sv');
sv.addEventListener('click',e=>{const pt=sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=pt.matrixTransform(sv.getScreenCTM().inverse()),p=[m.x,m.y];
  const hit=FIG.polys.map((d,i)=>({i,a:area(polyPx(d)),in:inPoly(p,polyPx(d))})).filter(o=>o.in).sort((a,b)=>a.a-b.a);if(hit.length)toggle(hit[0].i)});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('button');if(b)toggle(+b.dataset.p)});
$('#reset').onclick=reset;
$('#probs').innerHTML=FIGS.map((_,i)=>`<button data-f="${i}" class="${i?'':'on'}">${'①②③'[i]}</button>`).join('');
$('#probs').onclick=e=>{const b=e.target.closest('button');if(!b)return;cancelAnimationFrame(raf);st.fig=+b.dataset.f;[...$('#probs').children].forEach((x,i)=>x.classList.toggle('on',i===st.fig));layout();reset()};

/* ---- 복사 → 날아가기 → 포개기 ---- */
function place(U,cx,cy,f){const xs=U.map(p=>p[0]),ys=U.map(p=>p[1]),mx=(Math.min(...xs)+Math.max(...xs))/2,my=(Math.min(...ys)+Math.max(...ys))/2;return U.map(p=>[cx+(p[0]-mx)*f,cy-(p[1]-my)*f])}
$('#go').onclick=()=>{if(st.phase==='anim')return;if(st.phase==='rotated')scale();else fly()};
function mkFrame(F){const b=F.fitR,P=F.sM,c=P[0],W0=F.sT[b.m(0)],th=Math.atan2(b.a[1],b.a[0]),sc=Math.hypot(...b.a);
  return(u,v)=>{const cs=Math.cos(th*u),sn=Math.sin(th*u),fy=b.refl?1-2*u:1,k=1+(sc-1)*v,cx=c[0]+(W0[0]-c[0])*u,cy=c[1]+(W0[1]-c[1])*u;
    return P.map(p=>{const x=p[0]-c[0],y=(p[1]-c[1])*fy;return[cx+k*(x*cs-y*sn),cy+k*(x*sn+y*cs)]})}}
function fly(){
  if(st.sel.length<2)return;
  const dA=FIG.polys[st.sel[0]],dB=FIG.polys[st.sel[1]],uA=polyU(dA),uB=polyU(dB),moverFirst=area(uA)<=area(uB);
  const dM=moverFirst?dA:dB,dT=moverFirst?dB:dA,kM=moverFirst?0:1,kT=moverFirst?1:0,uM=moverFirst?uA:uB,uT=moverFirst?uB:uA;
  const xs=uT.map(p=>p[0]),ys=uT.map(p=>p[1]),f=Math.min(440/(Math.max(...xs)-Math.min(...xs)),330/(Math.max(...ys)-Math.min(...ys)));
  const sT=place(uT,1325,300,f),xm=uM.map(p=>p[0]),ym=uM.map(p=>p[1]),wm=(Math.max(...xm)-Math.min(...xm))*f,hm=(Math.max(...ym)-Math.min(...ym))*f;
  const sM=place(uM,950+wm/2+10,680-hm/2,f),p0M=polyPx(dM),p0T=polyPx(dT);
  const fitR=sM.length===sT.length?fitPoly(sM,sT):null,sim=!!fitR&&fitR.res<3,r=simPoly(uA,uB);
  const sym=uA.length===3?'△':'□';
  const F={fitR,sM,sT};const fr=fitR?mkFrame(F):null;st.ctx={F,fr,dM,dT,kM,kT};
  const pm=sim&&r.sim?r.map:null,fin=fr?fr(1,1):null,srcA=dA===dT,ptOf=L2=>srcA?sT[dT[1].indexOf(L2)]:(fin?fin[dM[1].indexOf(L2)]:null);
  st.res={sim,sym,left:pm?[...dA[1]]:null,right:pm?pm.map(j=>dB[1][j]):null,dots:pm?[...dA[1]].map((ch,i)=>ptOf(ch)):null};

  st.phase='anim';st.burst=0;const t0=performance.now(),TOT=fitR?3800:1500;
  const step=now=>{const t=now-t0,e=ease(clamp(t/900)),lp=(a,b)=>a.map((p,i)=>[p[0]+(b[i][0]-p[0])*e,p[1]+(b[i][1]-p[1])*e]);
    let mp=lp(p0M,sM);const tp=lp(p0T,sT);
    if(fr&&t>1400)mp=fr(ease(clamp((t-1400)/2400)),0);
    st.stage={u2:0,gaps:null,items:[{pts:tp,col:SEL[kT],lab:[...dT[1]]},{pts:mp,col:SEL[kM],lab:[...dM[1]],mover:true}]};
    if(t<TOT){draw();raf=requestAnimationFrame(step)}else{st.phase=fr?'rotated':'done';draw()}};
  raf=requestAnimationFrame(step)}
function scale(){
  const{F,fr,dM,dT,kM,kT}=st.ctx,tp=st.stage.items[0].pts;st.phase='anim';const t0=performance.now();
  const step=now=>{const v=ease(clamp((now-t0)/2600)),mp=fr(1,v);
    st.stage={u2:v,gaps:v>=1?mp.map((p,i)=>[p,F.sT[F.fitR.m(i)]]):null,items:[{pts:tp,col:SEL[kT],lab:[...dT[1]]},{pts:mp,col:SEL[kM],lab:[...dM[1]],mover:true}]};
    if(v<1){draw();raf=requestAnimationFrame(step)}else{st.phase='done';if(st.res.sim)st.burst=1;draw()}};
  raf=requestAnimationFrame(step)}
layout();draw();
</script>
