<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>닮음비 짝맞추기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  --paper:#F4FAFF; --grid:#D3E8F7; --ink:#1F2A44; --sun:#FFD93D; --blue:#1D4ED8;
  --mint:#2DBE7E; --red:#E5383B; --coral:#FF6B4A; --violet:#7C3AED;
  --display:'Jua','Gowun Dodum',sans-serif; --body:'Gowun Dodum','Jua',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:56px 56px;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:clamp(8px,1.4vw,22px);padding:clamp(6px,1vw,14px) max(14px,env(safe-area-inset-right)) clamp(4px,.6vw,8px) max(14px,env(safe-area-inset-left))}
.by{font-family:'Jua',sans-serif;font-size:clamp(11px,1.25vw,20px);opacity:.5;white-space:nowrap;flex:none;letter-spacing:-.01em}
.tag{font-family:var(--display);font-size:clamp(16px,2vw,30px);background:var(--sun);border:3px solid var(--ink);border-radius:14px;padding:2px clamp(10px,1.4vw,18px);white-space:nowrap;transform:rotate(-3deg);box-shadow:4px 4px 0 var(--ink)}
#time{font-family:var(--display);font-size:clamp(24px,3.4vw,54px);line-height:1;min-width:4.2em}
#time.ok{color:var(--mint)}
#msg{flex:1;min-width:0;font-family:var(--display);font-size:clamp(16px,2.1vw,34px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg.ok{color:var(--mint)} #msg.no{color:var(--red)}
.pill{border:3px solid var(--ink);background:#fff;border-radius:999px;font:400 clamp(14px,1.8vw,26px) var(--display);color:var(--ink);padding:clamp(3px,.5vw,8px) clamp(12px,1.6vw,24px);cursor:pointer;box-shadow:3px 3px 0 var(--ink);flex:none;white-space:nowrap}
.pill:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
main{flex:1;min-height:0;position:relative;padding:0 max(10px,env(safe-area-inset-right)) max(clamp(8px,1.2vw,16px),env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#board{height:100%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(5px,.8vw,14px)}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12em;
  background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);
  cursor:pointer;padding:2px;font-family:var(--display);line-height:1.05;transition:transform .12s,opacity .35s,background .12s;min-width:0}
.card .k{font-size:clamp(12px,1.7vw,32px)}
.card .v{font-size:clamp(20px,3vw,58px);white-space:nowrap}
.card.t0 .k{color:var(--coral)} .card.t1 .k{color:var(--blue)} .card.t2 .k{color:#15803D}
.card.sel{background:var(--sun);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.card.bad{background:#FFD8D8;animation:shake .4s}
.card.gone{opacity:0;transform:scale(.4) rotate(12deg);pointer-events:none}
.card.hid{visibility:hidden}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vw,28px);font-family:var(--display);text-align:center}
#over.on{display:flex}
#over .big{font-size:clamp(40px,8vw,140px);color:var(--mint);line-height:1}
#over .sub{font-size:clamp(20px,3vw,48px)}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:1}100%{transform:translateY(80vh) rotate(600deg);opacity:0}}
.conf{position:fixed;top:0;width:14px;height:14px;animation:fall 2s ease-in forwards;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){.card,.conf{transition:none;animation:none}}
</style>

<div id="app">
  <header>
    <div class="tag">짝맞추기</div><span class="by">by 이송원</span>
    <div id="time">0.0초</div>
    <div id="msg"></div>
    <button class="pill" id="shuffle" type="button">🔀 섞기</button>
    <button class="pill" id="newg" type="button">🎲 새 문제</button>
  </header>
  <main><div id="board"></div><div id="over"><div class="big" id="ovt"></div><div class="sub" id="ovs"></div><button class="pill" id="again" type="button">🎲 새 문제</button></div></main>
</div>

<script>
const $=s=>document.querySelector(s);
const POOL=[[1,2],[2,3],[1,3],[1,4],[2,5],[3,2],[3,1],[5,4],[3,4],[3,5],[5,3]];
const KIND=['닮음비','넓이비','부피비'];
let cards=[],sel=[],left=0,t0=0,timer=null,best=null,busy=false;
const fmt=(a,b)=>a+' : '+b;
function newGame(){
  const p=[...POOL].sort(()=>Math.random()-.5).slice(0,6);
  cards=[];p.forEach(([a,b],i)=>{
    cards.push({g:i,t:0,v:fmt(a,b)});
    cards.push({g:i,t:1,v:fmt(a*a,b*b)});
    cards.push({g:i,t:2,v:fmt(a*a*a,b*b*b)})});
  shuffle(true)}
function shuffle(keep){
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}
  if(keep!==true)return render();
  cards.forEach(c=>c.done=false);sel=[];left=6;busy=false;
  stop();t0=0;$('#time').textContent='0.0초';$('#time').className='';
  $('#msg').className='';$('#msg').textContent='카드 세 장을 골라 보세요';$('#over').classList.remove('on');
  render()}
function render(){
  $('#board').innerHTML=cards.map((c,i)=>
    `<button class="card t${c.t} ${c.done?'hid':''} ${sel.includes(i)?'sel':''}" data-i="${i}" type="button">`
    +`<span class="k">${KIND[c.t]}</span><span class="v">${c.v}</span></button>`).join('')}
function tick(){const s=((performance.now()-t0)/1000).toFixed(1);$('#time').textContent=s+'초'}
function stop(){if(timer){clearInterval(timer);timer=null}}
function confetti(){for(let i=0;i<40;i++){const d=document.createElement('div');d.className='conf';
  d.style.left=(Math.random()*100)+'vw';d.style.background=['#FF6B4A','#FFD93D','#2DBE7E','#4DA3FF','#B26BFF'][i%5];
  d.style.borderRadius=i%2?'50%':'3px';d.style.animationDelay=(Math.random()*.7).toFixed(2)+'s';
  document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}}
$('#board').addEventListener('click',e=>{
  const b=e.target.closest('[data-i]');if(!b||busy)return;
  const i=+b.dataset.i,c=cards[i];if(c.done)return;
  if(!t0){t0=performance.now();timer=setInterval(tick,100)}
  const at=sel.indexOf(i);
  if(at>=0)sel.splice(at,1);else if(sel.length<3)sel.push(i);
  render();
  if(sel.length<3)return;
  const S=sel.map(k=>cards[k]),ok=S[0].g===S[1].g&&S[1].g===S[2].g&&new Set(S.map(x=>x.t)).size===3;
  busy=true;
  if(ok){const m=$('#msg');m.className='ok';m.textContent='맞아요!';
    sel.forEach(k=>document.querySelector(`[data-i="${k}"]`).classList.add('gone'));
    const done=[...sel];sel=[];
    setTimeout(()=>{done.forEach(k=>cards[k].done=true);left--;busy=false;render();
      if(!left){stop();tick();const s=((performance.now()-t0)/1000).toFixed(1);
        if(best===null||+s<best)best=+s;
        $('#time').className='ok';
        $('#msg').className='ok';$('#msg').textContent=`클리어!  ${s}초`;
        $('#ovt').textContent=s+'초';$('#ovs').textContent='클리어!   최고 기록 '+best+'초';$('#over').classList.add('on');confetti()}},380)}
  else{const m=$('#msg');m.className='no';m.textContent='다시 골라 보세요';
    sel.forEach(k=>document.querySelector(`[data-i="${k}"]`).classList.add('bad'));
    setTimeout(()=>{sel=[];busy=false;$('#msg').className='';$('#msg').textContent='카드 세 장을 골라 보세요';render()},700)}});
$('#shuffle').onclick=()=>{if(busy)return;sel=[];shuffle()};
$('#newg').onclick=()=>newGame();
$('#again').onclick=()=>newGame();
newGame();
</script>
