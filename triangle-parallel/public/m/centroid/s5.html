<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/engine/gate.js" data-mat="centroid-lesson"></script>
<title>무게중심의 성질 ② 넓이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="c.css">
<style>
.piece{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.eq{display:inline-block;background:#F3EEFF;border-radius:10px;padding:0 8px;margin:2px 0}
.ca{color:#E0457B}.cb{color:#2F6FE0}.cc{color:#13906F}
</style>
<!-- 5. 무게중심의 성질 ②: 세 중선으로 나뉜 6개의 삼각형 넓이가 모두 같은 이유를 한 단계씩(밑변·높이 → 같은 이름 a, b, c → 중선이 넓이를 반으로 → a = b = c) -->
<div id="app">
  <header>
    <div class="tag">⑤ 성질 ② 넓이</div><span class="by">by 이송원</span>
    <div id="hint"></div>
    <div class="btns"><button class="pill" id="prev" type="button">◀ 이전</button><button class="pill hot" id="next" type="button">다음 ▶</button><button class="pill" id="measure" type="button">📐 재 보기</button><button class="pill" id="reset" type="button">↺ 처음</button></div>
  </header>
  <main>
    <svg id="sv" viewBox="0 0 1600 720" preserveAspectRatio="xMinYMid meet"></svg>
    <div class="proof" id="proof"></div>
  </main>
  <footer id="foot">
    <div class="def">세 중선으로 나뉜 <span class="term">6개의 삼각형의 넓이는 모두 같다</span> → 각각 △ABC의 <span class="key">1/6</span>
      <small>또, △GAB = △GBC = △GCA = △ABC의 1/3 (작은 삼각형 2개씩)</small></div>
  </footer>
</div>
<script src="c.js"></script>
<script>
const { $, S, P, mid, cen, area, draggable, clamp, confetti, sfx, label } = C;
const sv = $('#sv');
const START = { A: [400, 70], B: [70, 650], C: [790, 600] };
let V = JSON.parse(JSON.stringify(START)), step = 0, shown = false, cel = false;
const COL = { a: '#FF9AA2', b: '#A8D8FF', c: '#B5EAD7', all: '#FFE066' };
// 6조각: [꼭짓점1, 꼭짓점2] + G. 이름: BC쪽 a, CA쪽 b, AB쪽 c
const STEPS = [
  { t: '중선 세 개가 삼각형을 6조각으로 나눴어요. 크기가 다 달라 보이죠?', w: '정말 다를까? 하나씩 따져 봐요 🍕' },
  { t: '△GBD와 △GDC는 <b>밑변 BD = DC</b>, 높이가 같아요 → 넓이가 같아요. 둘 다 <b class="ca">a</b>', w: 'D가 BC의 중점이니까 밑변이 같아요' },
  { t: '같은 이유로 CA 쪽 두 조각은 둘 다 <b class="cb">b</b>, AB 쪽 두 조각은 둘 다 <b class="cc">c</b>', w: '중점 E, F도 밑변을 똑같이 나눠요' },
  { t: '중선 AD는 △ABC를 반으로 나눠요: △ABD = △ADC<br><span class="eq"><b class="cc">c</b> + <b class="cc">c</b> + <b class="ca">a</b> = <b class="ca">a</b> + <b class="cb">b</b> + <b class="cb">b</b></span> → <b class="cc">c</b> = <b class="cb">b</b>', w: '밑변 BD = DC, 높이가 같은 두 삼각형' },
  { t: '중선 BE도 반으로: △BCE = △BEA<br><span class="eq"><b class="ca">a</b> + <b class="ca">a</b> + <b class="cb">b</b> = <b class="cb">b</b> + <b class="cc">c</b> + <b class="cc">c</b></span> → <b class="ca">a</b> = <b class="cc">c</b>', w: '같은 방법!' },
  { t: '<b class="fin">a = b = c — 여섯 조각의 넓이가 모두 같아요!</b> 각각 △ABC의 1/6', w: '📐 재 보기로 숫자도 확인해 봐요' },
];
function draw() {
  sv.innerHTML = '';
  const { A, B, C: Cc } = V;
  const G = cen(A, B, Cc), D = mid(B, Cc), E = mid(Cc, A), F = mid(A, B);
  const pieces = [
    { p: [B, D], n: 'a' }, { p: [D, Cc], n: 'a' },
    { p: [Cc, E], n: 'b' }, { p: [E, A], n: 'b' },
    { p: [A, F], n: 'c' }, { p: [F, B], n: 'c' },
  ];
  const named = step >= 1, all = step >= 5;
  const U = 1 / 50, total = area(A, B, Cc) * U * U;
  pieces.forEach((pc, i) => {
    const show = all ? true : step >= 2 || (step === 1 && pc.n === 'a');
    const fill = all ? COL.all : show && named ? COL[pc.n] : '#FFF3D6';
    const c = cen(pc.p[0], pc.p[1], G);
    S('polygon', { points: [pc.p[0], pc.p[1], G].map(P).join(' '), fill, stroke: '#2A2140', 'stroke-width': 4, 'stroke-linejoin': 'round', class: (step === 1 && pc.n === 'a') || (step === 2 && pc.n !== 'a') || step === 5 ? 'pop' : '', style: `animation-delay:${(i % 2) * 0.15}s` }, sv);
    if (shown) { const t = S('text', { x: c[0], y: c[1], 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 34 }, sv); t.textContent = (area(pc.p[0], pc.p[1], G) * U * U).toFixed(1); }
    else if (show && named) { const t = S('text', { x: c[0], y: c[1], 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 46, fill: '#2A2140' }, sv); t.textContent = pc.n; }
  });
  // 3·4단계: 반으로 나누는 두 큰 삼각형을 굵은 테두리로
  const half = (p, col) => S('polygon', { points: p.map(P).join(' '), fill: 'none', stroke: col, 'stroke-width': 10, 'stroke-linejoin': 'round', opacity: 0.85 }, sv);
  if (step === 3) { half([A, B, D], '#E0457B'); half([A, D, Cc], '#2F6FE0'); }
  if (step === 4) { half([B, Cc, E], '#E0457B'); half([B, E, A], '#2F6FE0'); }
  [[D, 'D'], [E, 'E'], [F, 'F']].forEach(([p, n]) => label(sv, p, G, n, { size: 38, d: 34 }));
  const gt = S('text', { x: G[0] + 16, y: G[1] - 22, 'font-size': 40 }, sv); gt.textContent = 'G';
  ['A', 'B', 'C'].forEach((k) => label(sv, V[k], G, k, { size: 48, d: 58 }));
  if (shown) { const t = S('text', { x: 40, y: 690, 'font-size': 38 }, sv); t.textContent = `△ABC = ${total.toFixed(1)} → ÷ 6 = ${(total / 6).toFixed(1)}`; }
  ['A', 'B', 'C'].forEach((k) => {
    const h = S('g', {}, sv);
    S('circle', { cx: V[k][0], cy: V[k][1], r: 18, fill: '#FFD93D', stroke: '#2A2140', 'stroke-width': 4 }, h);
    S('circle', { cx: V[k][0], cy: V[k][1], r: 56, fill: 'transparent' }, h);
    draggable(sv, h, (q) => { V[k] = clamp(q, 60, 60, 810, 660); draw(); });
  });
  paint();
}
function paint() {
  const last = step === STEPS.length - 1;
  $('#proof').innerHTML = `<div style="margin-bottom:4px">🍕 왜 여섯 조각이 같을까?</div>` + STEPS.slice(0, step + 1).map((s, i) => `<div class="st ${i === step ? 'now' : ''}"><b class="n">${i + 1}</b><span>${s.t}<span class="why">${s.w}</span></span></div>`).join('');
  $('#proof').scrollTop = $('#proof').scrollHeight; // 새 단계가 보이게
  const h = $('#hint');
  h.classList.toggle('ok', last);
  h.textContent = last ? '여섯 조각 모두 같은 넓이! 🍕' : '다음 ▶을 눌러 이유를 하나씩 찾아요';
  $('#foot').classList.toggle('on', last);
  $('#prev').disabled = step === 0; $('#next').disabled = last;
}
$('#next').onclick = () => { if (step < STEPS.length - 1) { step += 1; sfx.pop(); draw(); if (step === STEPS.length - 1 && !cel) { cel = true; sfx.win(); confetti(sv, 450, 160); } } };
$('#prev').onclick = () => { if (step > 0) { step -= 1; draw(); } };
$('#measure').onclick = () => { shown = !shown; $('#measure').textContent = shown ? '🔤 a·b·c 보기' : '📐 재 보기'; sfx.pop(); draw(); };
$('#reset').onclick = () => { V = JSON.parse(JSON.stringify(START)); step = 0; shown = false; cel = false; $('#measure').textContent = '📐 재 보기'; draw(); };
draw();
</script>
