<!-- 8. 모둠 스피드 퀴즈: 모둠이 A~H형 중 하나를 골라 8문제를 푼다(유형끼리 문제 종류·난이도는 같고 겹치는 문제는 없음).
     틀리면 5초 추가, 걸린 시간이 짧을수록 1등. 기록은 서버에 20분 동안 남아 모든 모둠 화면에서 보인다. -->

<script>
const { $, S, P, mid, lerp, cen, sfx, confetti } = C;
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const TYPES = 'ABCDEFGH'.split('');
const PENALTY = 5;
// 유형마다 다른 삼각형 모양(그림 칸 520×340)
const TRI = [
  [[250, 34], [42, 306], [480, 296]], [[176, 34], [48, 300], [472, 308]], [[338, 34], [40, 298], [482, 290]], [[128, 40], [58, 306], [470, 282]],
  [[396, 40], [46, 290], [462, 308]], [[262, 30], [92, 308], [482, 298]], [[212, 36], [40, 292], [432, 308]], [[306, 30], [58, 308], [446, 300]],
];
// ---------- 문제 은행: 8칸(문제 종류) × 8유형(A~H). 같은 칸은 종류·난이도가 같고 내용은 모두 다르다 ----------
const WORDS = [
  { w: '중선', c: 'ㅈㅅ', q: '꼭짓점과 마주 보는 변의 중점을 이은 선분', f: 'median' },
  { w: '무게중심', c: 'ㅁㄱㅈㅅ', q: '삼각형의 세 중선이 만나는 점', f: 'centroid' },
  { w: '중점', c: 'ㅈㅈ', q: '선분을 똑같이 둘로 나누는 점', f: 'mid' },
  { w: '교점', c: 'ㄱㅈ', q: '두 선이 만나는 점', f: 'inter' },
  { w: '꼭짓점', c: 'ㄲㅈㅈ', q: '삼각형의 뾰족한 세 점', f: 'vert' },
  { w: '대변', c: 'ㄷㅂ', q: '꼭짓점 A와 마주 보는 변 BC를 A의 ○○이라 해요', f: 'side' },
  { w: '중력', c: 'ㅈㄹ', q: '무게중심 기호 G는 Gravity, 우리말로?', f: 'gravity' },
  { w: '균형', c: 'ㄱㅎ', q: '무게중심을 받치면 물체가 ○○을 잡아요', f: 'balance' },
];
const FAKE = ['중앙', '직선', '접점', '각도', '수선', '높이', '넓이', '중심'];
const OX = [
  ['무게중심은 세 중선의 교점이다.', 'O'], ['한 삼각형에는 중선이 2개 있다.', 'X'], ['무게중심은 중선을 꼭짓점으로부터 1 : 2로 나눈다.', 'X'], ['세 중선으로 나뉜 6개 삼각형의 넓이는 모두 같다.', 'O'],
  ['무게중심은 삼각형의 바깥에 있을 수도 있다.', 'X'], ['무게중심 G에서 AG는 GD의 2배이다.', 'O'], ['△GAB의 넓이는 △ABC의 1/2이다.', 'X'], ['실로 매단 종이의 무게중심은 실을 아래로 늘인 선 위에 있다.', 'O'],
];
const N3 = [9, 12, 15, 18, 21, 24, 27, 30];      // 중선 AD → AG
const N4 = [4, 3, 5, 6, 7, 2, 8, 9];              // GD → AD
const N5 = [18, 24, 30, 36, 42, 48, 54, 60];      // △ABC → 한 조각
const N6 = [5, 7, 4, 8, 6, 9, 10, 11];            // △GAB → △ABC
const N7 = [8, 6, 10, 12, 14, 16, 18, 4];         // BG → GE
const N8 = [2, 1, 3, 4, 5, 6, 7, 8];              // AD = 9q, G'은 △GBC의 무게중심 → GG'
const opts = (ans, cands) => { const o = [ans]; for (const c of cands) if (o.length < 4 && c > 0 && Number.isInteger(c) && !o.includes(c)) o.push(c); let k = 1; while (o.length < 4) { if (!o.includes(ans + k)) o.push(ans + k); k++; } return shuffle(o.map(String)); };
function setOf(ti) {
  const i = ti, W = WORDS[i];
  const others = shuffle([...WORDS.filter((x) => x !== W).map((x) => x.w), ...FAKE]).slice(0, 3);
  const n3 = N3[i], n4 = N4[i], n5 = N5[i], n6 = N6[i], n7 = N7[i], q8 = N8[i];
  return [
    { k: '🔤 초성 퀴즈', cho: W.c, t: W.q, a: W.w, o: shuffle([W.w, ...others]), f: { kind: W.f } },
    { k: '⭕❌ OX', t: OX[i][0], a: OX[i][1], o: ['O', 'X'], f: { kind: 'centroid' } },
    { k: '📏 2 : 1', t: `G는 무게중심, 중선 AD = ${n3} 일 때 AG = ?`, a: String((2 * n3) / 3), o: opts((2 * n3) / 3, [n3 / 3, n3 / 2, n3, n3 * 2]), f: { kind: 'q3', v: n3 } },
    { k: '📏 2 : 1', t: `G는 무게중심, GD = ${n4} 일 때 중선 AD = ?`, a: String(3 * n4), o: opts(3 * n4, [2 * n4, 4 * n4, n4 + 3, 6 * n4]), f: { kind: 'q4', v: n4 } },
    { k: '🍕 넓이', t: `△ABC = ${n5} 일 때 색칠한 삼각형의 넓이는?`, a: String(n5 / 6), o: opts(n5 / 6, [n5 / 3, n5 / 2, n5 / 6 + 2, n5 / 12]), f: { kind: 'q5', v: n5 } },
    { k: '🍕 넓이', t: `색칠한 △GAB = ${n6} 일 때 △ABC의 넓이는?`, a: String(3 * n6), o: opts(3 * n6, [6 * n6, 2 * n6, 4 * n6, n6 + 6]), f: { kind: 'q6', v: n6 } },
    { k: '📏 2 : 1', t: `G는 무게중심, BG = ${n7} 일 때 GE = ?`, a: String(n7 / 2), o: opts(n7 / 2, [n7, 2 * n7, n7 / 2 + 1, (3 * n7) / 2]), f: { kind: 'q7', v: n7 } },
    { k: '🧠 도전', t: `G는 △ABC의, G'은 △GBC의 무게중심. AD = ${9 * q8} 일 때 GG' = ?`, a: String(2 * q8), o: opts(2 * q8, [3 * q8, q8, 6 * q8, 4 * q8]), f: { kind: 'q8', v: 9 * q8 } },
  ];
}
// ---------- 문제 그림 ----------
function fig(f, ti) {
  const [A, B, Cc] = TRI[ti];
  const svg = S('svg', { viewBox: '0 0 520 340' });
  const G = cen(A, B, Cc), D = mid(B, Cc), E = mid(Cc, A), F = mid(A, B);
  const line = (p, q, col, w, dash) => S('line', { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: col || '#2A2140', 'stroke-width': w || 4, 'stroke-linecap': 'round', 'stroke-dasharray': dash || null }, svg);
  const txt = (p, t, col, size) => { const el = S('text', { x: p[0], y: p[1], 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': size || 26, fill: col || '#2A2140', stroke: '#FFFDF5', 'stroke-width': 6, 'paint-order': 'stroke' }, svg); el.textContent = t; return el; };
  const dot = (p, col, r) => S('circle', { cx: p[0], cy: p[1], r: r || 7, fill: col || '#2A2140' }, svg);
  const out = (p, t, d) => { const u = [p[0] - G[0], p[1] - G[1]], L = Math.hypot(u[0], u[1]) || 1; txt([p[0] + (u[0] / L) * (d || 22), p[1] + (u[1] / L) * (d || 22)], t, '#2A2140', 28); };
  const poly = (pts, fill, op) => S('polygon', { points: pts.map(P).join(' '), fill, opacity: op || 1, stroke: '#2A2140', 'stroke-width': 3, 'stroke-linejoin': 'round' }, svg);
  const tick = (p, q, n) => { const m = mid(p, q), L = Math.hypot(q[0] - p[0], q[1] - p[1]), nx = -(q[1] - p[1]) / L, ny = (q[0] - p[0]) / L; for (let i = 0; i < n; i++) { const o = (i - (n - 1) / 2) * 7, ux = (q[0] - p[0]) / L, uy = (q[1] - p[1]) / L; line([m[0] + ux * o - nx * 10, m[1] + uy * o - ny * 10], [m[0] + ux * o + nx * 10, m[1] + uy * o + ny * 10], '#2A2140', 3); } };
  const along = (p, q, t, col, side) => { const m = mid(p, q), L = Math.hypot(q[0] - p[0], q[1] - p[1]), nx = -(q[1] - p[1]) / L, ny = (q[0] - p[0]) / L; const s = side || 1; txt([m[0] + nx * 26 * s, m[1] + ny * 26 * s], t, col, 28); };
  poly([A, B, Cc], '#FFE7A8');
  const k = f.kind;
  const medians = () => { line(A, D, '#FF6B6B', 4); line(B, E, '#2DBE9E', 4); line(Cc, F, '#9B6BFF', 4); };
  if (k === 'median') { line(A, D, '#FF6B6B', 8); tick(B, D, 1); tick(D, Cc, 1); dot(D, '#FF6B6B'); out(D, 'D'); }
  if (k === 'centroid') { medians(); dot(G, '#FF6B6B', 10); txt([G[0] + 22, G[1] - 18], 'G', '#FF6B6B', 30); }
  if (k === 'mid') { line(B, Cc, '#6FB7FF', 8); tick(B, D, 1); tick(D, Cc, 1); dot(D, '#FF6B6B', 10); out(D, 'M'); }
  if (k === 'inter') { line(A, D, '#FF6B6B', 5); line(B, E, '#2DBE9E', 5); S('circle', { cx: G[0], cy: G[1], r: 18, fill: 'none', stroke: '#FF6B6B', 'stroke-width': 5 }, svg); txt([G[0] + 30, G[1] - 22], '?', '#FF6B6B', 34); }
  if (k === 'vert') { [A, B, Cc].forEach((p) => S('circle', { cx: p[0], cy: p[1], r: 14, fill: '#FF6B6B', stroke: '#2A2140', 'stroke-width': 3 }, svg)); }
  if (k === 'side') { line(B, Cc, '#FF6B6B', 9); S('circle', { cx: A[0], cy: A[1], r: 12, fill: '#2DBE9E' }, svg); }
  if (k === 'gravity') { medians(); dot(G, '#FF6B6B', 10); line(G, [G[0], G[1] + 80], '#FF6B6B', 5); S('polygon', { points: `${G[0] - 12},${G[1] + 72} ${G[0] + 12},${G[1] + 72} ${G[0]},${G[1] + 94}`, fill: '#FF6B6B' }, svg); txt([G[0] + 22, G[1] - 18], 'G', '#FF6B6B', 30); }
  if (k === 'balance') { dot(G, '#FF6B6B', 10); S('rect', { x: G[0] - 9, y: G[1] + 8, width: 18, height: 120, fill: '#FFD93D', stroke: '#2A2140', 'stroke-width': 3 }, svg); S('polygon', { points: `${G[0] - 9},${G[1] + 8} ${G[0] + 9},${G[1] + 8} ${G[0]},${G[1] - 4}`, fill: '#F6C27A', stroke: '#2A2140', 'stroke-width': 2 }, svg); }
  if (k === 'q3' || k === 'q4') {
    line(A, G, '#FF6B6B', 7); line(G, D, '#6FB7FF', 7); tick(B, D, 1); tick(D, Cc, 1); dot(D); dot(G, '#2A2140', 8);
    txt([G[0] + 24, G[1] - 16], 'G'); out(D, 'D');
    const s = (G[0] < A[0]) ? 1 : -1;
    // 길이는 문제 글에 있으니 그림에는 구할 곳(?)과 주어진 짧은 길이만
    if (k === 'q3') { along(A, G, '?', '#FF6B6B', s); along(G, D, '', '#2F6FE0', s); }
    else { along(G, D, String(f.v), '#2F6FE0', s); }
  }
  if (k === 'q5') { poly([B, D, G], '#FF9AA2'); medians(); dot(G); txt([G[0] + 22, G[1] - 18], 'G'); out(D, 'D'); }
  if (k === 'q6') { poly([G, A, B], '#A8D8FF'); line(Cc, F, '#9B6BFF', 3, '8 6'); line(A, D, '#2A2140', 3, '8 6'); line(B, E, '#2A2140', 3, '8 6'); dot(G); txt([G[0] + 22, G[1] - 18], 'G'); const c = cen(G, A, B); txt(c, String(f.v), '#2F6FE0', 34); }
  if (k === 'q7') { line(B, G, '#FF6B6B', 7); line(G, E, '#6FB7FF', 7); tick(Cc, E, 2); tick(E, A, 2); dot(E); dot(G, '#2A2140', 8); out(E, 'E'); txt([G[0] + 6, G[1] - 26], 'G'); along(B, G, String(f.v), '#D6336C', -1); along(G, E, '?', '#2F6FE0', -1); }
  if (k === 'q8') {
    const G2 = cen(G, B, Cc);
    poly([G, B, Cc], '#DDEBFF'); line(A, D, '#2A2140', 4); line(G, D, '#FF6B6B', 6);
    dot(D); dot(G, '#2A2140', 8); dot(G2, '#9B6BFF', 9); out(D, 'D');
    txt([G[0] + 26, G[1] - 10], 'G'); txt([G2[0] + 28, G2[1] - 6], "G'", '#9B6BFF', 28);
    tick(B, D, 1); tick(D, Cc, 1);
  }
  out(A, 'A'); out(B, 'B'); out(Cc, 'C');
  return svg;
}
// ---------- 기록판(서버, 20분) ----------
// 따로 배포한 주소에서도 기록은 본 사이트 서버에 저장
const API = /triangle-parallel|localhost|127.0.0.1/.test(location.hostname) ? '' : 'https://triangle-parallel.vercel.app';
const myCls = (() => { try { const m = JSON.parse(sessionStorage.getItem('tp-me') || 'null'); return (m && m.cls) || sessionStorage.getItem('mat-cls') || ''; } catch (e) { return ''; } })();
async function getRecords() { try { const r = await fetch(API + '/api/game?game=cquiz', { cache: 'no-store' }); return (await r.json()).records || []; } catch (e) { return null; } }
async function postRecord(rec) { const r = await fetch(API + '/api/game', { method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: 'cquiz', ...rec, cls: myCls }) }); return (await r.json()).records || []; }
const fmt = (sec) => `${Math.floor(sec / 60)}:${(sec % 60).toFixed(1).padStart(4, '0')}`;
function boardHtml(list, me) {
  if (!list) return '<div class="empty">기록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</div>';
  if (!list.length) return '<div class="empty">아직 기록이 없어요. 첫 기록의 주인공이 되어 봐요!</div>';
  const ago = (t) => { const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? '방금' : `${m}분 전`; };
  // 최종 기록 = 시간 기록 + 틀림 × 5초 (서버에는 최종 기록 sec와 틀린 횟수 wrong이 저장됨). 최종 기록이 짧을수록 1등
  return `<table><tr><th>순위</th><th>모둠</th><th>유형</th><th>시간 기록</th><th>틀림 (×${PENALTY}초)</th><th>최종 기록</th><th></th></tr>${list.map((r, i) => {
    const raw = Math.max(0, Math.round((r.sec - r.wrong * PENALTY) * 10) / 10);
    return `<tr class="${i === 0 ? 'first' : ''} ${me && me.at === r.at ? 'me' : ''}"><td>${i === 0 ? '🏆' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</td><td>${r.cls ? `${r.cls}반 ` : ''}${r.group}모둠</td><td>${r.type}형</td><td>${fmt(raw)}</td><td>${r.wrong}개 <span style="color:#FF6B6B">(+${r.wrong * PENALTY}초)</span></td><td><b style="color:#2A2140;font-size:1.15em">${fmt(r.sec)}</b></td><td style="font-size:.7em;color:#9a8fb0">${ago(r.at)}</td></tr>`;
  }).join('')}</table><div style="font-size:.7em;color:#9a8fb0;margin-top:6px">최종 기록 = 시간 기록 + 틀림 × ${PENALTY}초 · 최종 기록이 짧을수록 1등</div>`;
}
let boardTimer = null;
async function showBoard(me) {
  clearInterval(timer); clearInterval(boardTimer);
  const paint = async () => {
    const list = await getRecords();
    $('#box').innerHTML = `<div class="panel"><h2>🏆 모둠 기록판 <span style="font-size:.6em;color:#9a8fb0">(최근 20분 · 시간이 짧을수록 1등)</span></h2>${boardHtml(list, me)}
      <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="ghost" id="b1" type="button">🏠 처음으로</button></div></div>`;
    $('#b1').onclick = home;
  };
  await paint();
  boardTimer = setInterval(paint, 5000);
}
// ---------- 진행 ----------
let group = 0, type = '', list = [], qi = 0, t0 = 0, wrong = 0, timer = null, busy = false;
async function home() {
  clearInterval(timer); clearInterval(boardTimer);
  const recs = (await getRecords()) || [];
  const used = new Set(recs.map((r) => r.type));
  $('#hint').textContent = '모둠끼리 기록 대결! 빨리, 정확하게 ⚡';
  $('#box').innerHTML = `<div class="panel"><h2>⚡ 무게중심 모둠 스피드 퀴즈</h2>
    <div class="rules">📌 8문제를 모두 맞히면 끝! 걸린 시간이 기록이에요. · ❌ 틀리면 <b style="color:#FF6B6B">+${PENALTY}초</b> · 🏆 기록은 20분 동안 기록판에 남아요.<br>A~H형은 문제 종류와 난이도가 같고, 문제는 모두 달라요.</div>
    <div style="margin-top:10px">① 우리 모둠</div><div class="pick" id="g">${[1, 2, 3, 4, 5, 6, 7, 8].map((n) => `<button data-g="${n}" type="button">${n}</button>`).join('')}</div>
    <div>② 문제 유형</div><div class="pick" id="t">${TYPES.map((t) => `<button data-t="${t}" type="button">${t}${used.has(t) ? '<small>다른 모둠도 풀었어요</small>' : ''}</button>`).join('')}</div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="go" id="start" type="button" disabled>시작! ▶</button><span id="sel" style="color:#9a8fb0"></span></div></div>`;
  const upd = () => { $('#start').disabled = !(group && type); $('#sel').textContent = group && type ? `${group}모둠 · ${type}형` : '모둠과 유형을 골라요'; };
  document.querySelectorAll('[data-g]').forEach((b) => { b.onclick = () => { group = +b.dataset.g; document.querySelectorAll('[data-g]').forEach((x) => x.classList.toggle('on', x === b)); sfx.pop(); upd(); }; });
  document.querySelectorAll('[data-t]').forEach((b) => { b.onclick = () => { type = b.dataset.t; document.querySelectorAll('[data-t]').forEach((x) => x.classList.toggle('on', x === b)); sfx.pop(); upd(); }; });
  if (group) document.querySelector(`[data-g="${group}"]`)?.classList.add('on');
  if (type) document.querySelector(`[data-t="${type}"]`)?.classList.add('on');
  upd();
  $('#start').onclick = countdown;
}
function countdown() {
  let n = 3;
  const show = () => { $('#box').innerHTML = `<div class="count">${n || 'GO!'}</div>`; sfx.pop(); };
  show();
  const iv = setInterval(() => { n -= 1; if (n >= 0) show(); else { clearInterval(iv); begin(); } }, 750);
}
function begin() {
  list = setOf(TYPES.indexOf(type)); qi = 0; wrong = 0; busy = false; t0 = performance.now();
  clearInterval(timer);
  timer = setInterval(() => { const el = $('#time'); if (el) el.textContent = `⏱ ${fmt(elapsed())}`; }, 100);
  show();
}
const elapsed = () => (performance.now() - t0) / 1000 + wrong * PENALTY;
function show() {
  const p = list[qi];
  $('#hint').textContent = `${group}모둠 · ${type}형 — 다 함께 의논해서 골라요!`;
  $('#box').innerHTML = `<div class="bar"><span class="time" id="time">⏱ ${fmt(elapsed())}</span><span>${qi + 1} / ${list.length}</span><span>❌ ${wrong} (+${wrong * PENALTY}초)</span></div>
    <div class="panel q"><div id="fig"></div><div><span class="kind">${p.k}</span>
      ${p.cho ? `<div class="cho">${[...p.cho].map((c, i) => `<b style="animation-delay:${i * 0.08}s">${c}</b>`).join('')}</div>` : ''}
      <div class="qt">${p.t}</div>
      <div class="opts">${p.o.map((o) => `<button class="opt" data-v="${o}" type="button">${o}</button>`).join('')}</div></div></div>`;
  $('#fig').appendChild(fig(p.f, TYPES.indexOf(type)));
  document.querySelectorAll('.opt').forEach((b) => { b.onclick = () => pick(b); });
}
function flash(t, col) { const f = $('#flash'); f.textContent = t; f.style.color = col || ''; f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
function pick(b) {
  if (busy || b.classList.contains('no')) return;
  const p = list[qi];
  if (b.dataset.v === p.a) {
    busy = true; b.classList.add('yes'); sfx.good(); flash('⭕', '#2DBE9E');
    setTimeout(() => { busy = false; qi += 1; if (qi < list.length) show(); else finish(); }, 550);
  } else {
    wrong += 1; b.classList.add('no'); sfx.bad(); flash(`+${PENALTY}초`, '#FF6B6B');
    const bar = document.querySelector('.bar span:last-child'); if (bar) bar.textContent = `❌ ${wrong} (+${wrong * PENALTY}초)`;
  }
}
async function finish() {
  clearInterval(timer);
  const sec = Math.round(elapsed() * 10) / 10;
  sfx.win();
  $('#hint').textContent = '클리어! 기록을 저장하고 있어요…';
  $('#box').innerHTML = `<div class="panel" style="text-align:center"><div style="font-size:2.4em">🎉 ${fmt(sec)}</div><div>${group}모둠 · ${type}형 · 틀린 횟수 ${wrong}</div></div>`;
  let recs = null, me = null;
  try { recs = await postRecord({ group, type, sec, wrong }); me = recs.find((r) => r.group === group && r.type === type && Math.abs(r.sec - sec) < 0.05) || null; } catch (e) { recs = null; }
  const rank = recs && me ? recs.indexOf(me) + 1 : 0;
  $('#hint').textContent = rank === 1 ? '🏆 지금 1등이에요! 상품 후보!' : rank ? `지금 ${rank}등이에요!` : '기록을 저장하지 못했어요 (기록판에 남지 않을 수 있어요)';
  $('#box').innerHTML = `<div class="panel" style="text-align:center"><div style="font-size:2.2em">${rank === 1 ? '🏆' : '🎉'} 최종 기록 ${fmt(sec)}</div><div>${group}모둠 · ${type}형</div><div style="color:#5a5070">시간 기록 ${fmt(Math.max(0, Math.round((sec - wrong * PENALTY) * 10) / 10))} + 틀림 ${wrong}개 × ${PENALTY}초 = <b style="color:#2A2140">${fmt(sec)}</b></div></div>
    <div class="panel"><h2>🏆 기록판 <span style="font-size:.6em;color:#9a8fb0">(최근 20분)</span></h2>${boardHtml(recs, me)}
    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="ghost" id="again" type="button">다른 유형 도전</button><button class="ghost" id="live" type="button">기록판 크게 보기</button></div></div>`;
  $('#again').onclick = () => { type = ''; home(); };
  $('#live').onclick = () => showBoard(me);
}
$('#home').onclick = home;
$('#board').onclick = () => showBoard(null);
home();
</script>
